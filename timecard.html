            const [syncStatus, setSyncStatus] = useState({ state: 'idle', message: '', lastSync: localStorage.getItem('timecard_last_sync') || '' });
            // 月次確認（スタッフ名|YYYY-MM → 確認日時）
            const [confirmations, setConfirmations] = useState(() => safeParseJSON(localStorage.getItem('timecard_confirmations'), {}));
            useEffect(() => { localStorage.setItem('timecard_confirmations', JSON.stringify(confirmations)); }, [confirmations]);

            useEffect(() => { localStorage.setItem('timecard_staff_v2', JSON.stringify(staffList)); }, [staffList]);
            useEffect(() => { localStorage.setItem('timecard_records', JSON.stringify(timeRecords)); }, [timeRecords]);
            useEffect(() => { localStorage.setItem('admin_pin', adminPin); }, [adminPin]);
            useEffect(() => { localStorage.setItem('timecard_gas_url', gasUrl); }, [gasUrl]);

            // 既存スタッフの賄い設定を一括で「なし (false)」にリセットする1回限りのマイグレーション
            // 【障害⑥対策】新しい端末（初期値名簿のまま）ではローカル変更のみ行い、クラウドへは絶対に送信しない。
            // クラウド送信はGASから正規の設定を受信済み（hydrated）の端末に限定する。
            useEffect(() => {
                const migrated = localStorage.getItem('timecard_meal_reset_20260621');
                if (!migrated && staffList.length > 0) {
                    const updatedList = staffList.map(s => ({ ...s, defaultMeal: false }));
                    setStaffList(updatedList);
                    if (settingsHydratedRef.current && !isDefaultSeedList(updatedList)) {
                        saveSettingsToGAS(updatedList, adminPin);
                    }
                    localStorage.setItem('timecard_meal_reset_20260621', 'true');
                }
            }, []);

            // ===== 設定の同期（スタッフリスト、PINコード） =====
            // 【障害⑥対策ガード】以下の場合はクラウド保存を拒否する:
            //   1. 名簿が空・不正型（同期異常でStateが壊れた場合の防波堤）
            //   2. 名簿が初期値（仮データ）そのもの → 本番を初期値で上書きする事故を根絶
            //   3. クラウドから一度も設定を受信していない端末（新端末・キャッシュクリア直後）
            const saveSettingsToGAS = async (newList, newPin) => {
                if (!gasUrl) return;
                const listToSave = newList || staffList;
                if (!Array.isArray(listToSave) || listToSave.length === 0) {
                    console.warn('saveSettingsToGAS: 名簿が空のため保存を拒否しました');
                    return;
                }
                if (isDefaultSeedList(listToSave)) {
                    console.warn('saveSettingsToGAS: 初期値名簿（仮データ）のため保存を拒否しました（障害⑥ガード）');
                    return;
                }
                if (!settingsHydratedRef.current) {
                    console.warn('saveSettingsToGAS: クラウド設定が未受信の端末のため保存を拒否しました（障害⑥ガード）');
                    return;
                }
                // 設定変更時刻を付与し、この端末のローカル基準時刻として記録しておく。
                // （クラウド保存はno-corsで完了を待てないため、直後のポーリングが古い名簿を
                //   返してきても、この時刻より古ければ反映をスキップして削除等を保持する）
                const settingsTs = new Date().toISOString();
                localSettingsUpdatedAtRef.current = settingsTs;
                try {
                    await fetch(gasUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({
                            action: 'saveSettings',
                            settings: {
                                staffList: listToSave,
                                adminPin: newPin || adminPin,
                                settingsUpdatedAt: settingsTs
                            }
                        })
                    });
                } catch(e) { console.error('Save settings failed', e); }
            };

            const syncSettingsFromGAS = async (url) => {
                const targetUrl = url || gasUrl;
                if (!targetUrl) return;
                try {
                    const response = await fetch(targetUrl + '?action=getSettings', { method: 'GET' });
                    if (!response.ok) return;
                    const data = await response.json();
                    if (data && data.status === 'ok') {
                        // クラウドと正常に疎通し設定応答を受信できた時点で hydrated フラグを立てる
                        // （設定が未作成 = null の場合も「クラウドの正しい状態を確認済み」とみなす）
                        settingsHydratedRef.current = true;
                        localStorage.setItem('timecard_settings_hydrated', 'true');
                    }
                    if (data && data.status === 'ok' && data.settings) {
                        // 【新旧判定】この端末でローカル変更した時刻より、クラウドの設定が古い（または時刻が無い）場合は
                        // 「まだ自分の保存が反映されていない古いデータ」とみなし、名簿・PINの反映をスキップする。
                        // （削除直後のポーリングが削除前の名簿を拾って復活させる不具合の対策）
                        const cloudTs = data.settings.settingsUpdatedAt ? String(data.settings.settingsUpdatedAt) : '';
                        const localTs = localSettingsUpdatedAtRef.current || '';
                        const cloudIsStale = localTs && (!cloudTs || cloudTs < localTs);

                        if (cloudIsStale) {
                            console.warn('syncSettingsFromGAS: クラウド設定が自端末の変更より古いため名簿・PINの反映をスキップ（削除復活防止）');
                        } else {
                            // 【型バリデーション】配列であり、有効な名前を持つ要素が1件以上ある場合のみStateへ反映。
                            // 空配列・不正型はStateを破壊しないため無視する（障害①③類似パターン対策）
                            if (Array.isArray(data.settings.staffList)) {
                                const withDefaults = (s) => {
                                    const base = typeof s === 'string' ? { name: s, defaultMeal: false } : s;
                                    return { isOutsourced: false, hourlyRate: 1200, dailyTransport: 0, ...base };
                                };
                                const validList = data.settings.staffList
                                    .filter(s => (typeof s === 'string' && s.trim()) || (s && typeof s === 'object' && typeof s.name === 'string' && s.name.trim()))
                                    .map(withDefaults);
                                if (validList.length > 0) {
                                    setStaffList(validList);
                                } else {
                                    console.warn('syncSettingsFromGAS: クラウドの名簿が空または不正のため反映をスキップしました');
                                }
                            }
                            if (data.settings.adminPin && /^\d{4}$/.test(String(data.settings.adminPin))) {
                                setAdminPin(String(data.settings.adminPin));
                            }
                            // 反映できた＝クラウドが最新に追いついたので、以後は通常同期に戻すためローカル基準時刻を合わせる
                            if (cloudTs) localSettingsUpdatedAtRef.current = cloudTs;
                        }

                        // 月次確認（confirmations）は名簿とは別系統のため、新旧判定に関わらず常に反映する
                        if (data.settings.confirmations && typeof data.settings.confirmations === 'object') {
                            setConfirmations(data.settings.confirmations);
                        }
                        console.log('Settings synced from GAS');
                    }
                } catch(e) { console.error('Sync settings failed', e); }
            };

            // === clientUpdatedAt ベースの同期保護 ===
            // 全てのレコード変更時に clientUpdatedAt (ISO 8601) を付与。
            // 同期時はこのタイムスタンプで新旧を判定し、最新データを勝たせる。

            // 月次確認「今月分を確認しました」をGASへ記録（押すたびに日時上書き）
            const confirmMonth = async (staffName, yearMonth) => {
                const now = new Date().toLocaleString('sv-SE', { timeZone: 'Asia/Tokyo' }).slice(0, 16);
                setConfirmations(prev => ({ ...prev, [`${staffName}|${yearMonth}`]: now }));
                if (!gasUrl) return;
                try {
                    await fetch(gasUrl, {
                        method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({ action: 'confirmMonth', staffName, yearMonth })
                    });
                } catch (e) { console.error('confirmMonth failed', e); }
            };

            // GASへの送信関数
            const sendToGAS = async (record) => {
                if (!gasUrl) return;
                // clientUpdatedAt が無い場合は付与（安全弁）
                if (!record.clientUpdatedAt) record.clientUpdatedAt = new Date().toISOString();
                localStorage.setItem('timecard_local_update_time', Date.now().toString());

                // 【キューファースト方式】送信前に必ず未送信キューへ登録する。
                // no-corsモードではサーバー側の成否を読めないため、fetch成功だけではキューから消さず、
                // 次回の同期(syncFromGAS)でクラウドに実データが反映されたのを確認してから削除する（確認ベース削除）。
                // これにより通信断・サーバーエラー・途中切断のどのパターンでも打刻データが欠落しない。
                const pending = safeParseJSON(localStorage.getItem('timecard_pending_sync'), []);
                const existingIdx = pending.findIndex(p => p && p.id === record.id);
                if (existingIdx >= 0) {
                    pending[existingIdx] = record; // 最新データで上書き
                } else {
                    pending.push(record);
                }
                localStorage.setItem('timecard_pending_sync', JSON.stringify(pending));

                try {
                    await fetch(gasUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({ action: 'record', ...record })
                    });
                    // no-corsモードではレスポンスを読めないため、ここではキューを消さない（同期時に確認して削除）
                } catch(e) {
                    // 送信失敗 → キューには登録済みなので次回同期時に自動再送される
                    // エラーをUIに通知
                    if (onError) onError('SYNC_FAIL', `クラウドへの保存に失敗しました。打刻はこの端末には記録されています。\n管理者に「SYNC_FAIL」のエラーが出たとご連絡ください。\n（詳細: ${e.message || '不明'}）`);
                }
            };

            const deleteFromGAS = async (recordId) => {
                if (!gasUrl) return;
                // スタッフ名に「_」が含まれても正しく分割できるよう、末尾の日付部分で分離する
                const parts = String(recordId).match(/^(.+)_(\d{4}-\d{2}-\d{2})$/);
                if (!parts) { console.warn('deleteFromGAS: 不正なID形式', recordId); return; }
                const staff = parts[1], dStr = parts[2];
                const deleteRecord = {
                    id: recordId,
                    staffName: staff,
                    date: dStr,
                    deleted: true,
                    remarks: "【完全削除済】", // 古いGASがdeletedフラグを無視した場合のフォールバック
                    clientUpdatedAt: new Date().toISOString()
                };
                await sendToGAS(deleteRecord);
            };

            // 未送信データの再送信
            const retrySendPending = async (url) => {
                const targetUrl = url || gasUrl;
                if (!targetUrl) return;
                const pending = safeParseJSON(localStorage.getItem('timecard_pending_sync'), []);
                if (pending.length === 0) return;
                try {
                    await fetch(targetUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({ action: 'sync', records: pending })
                    });
                    // 【確認ベース削除】no-corsでは成否を読めないため、ここでは消さない。
                    // 次回の syncFromGAS でクラウド反映を確認したものだけがキューから削除される。
                } catch(e) { /* 次回再試行 */ }
            };

            // 同期の多重実行防止フラグ。前回の同期が完了する前に3秒ポーリング等で
            // 次の同期が始まると、サーバー側の同時実行数が積み上がり404の原因になる。
            const syncInFlightRef = useRef(false);

            // ===== GASから全データを取得（clientUpdatedAt ベースの双方向同期）=====
            const syncFromGAS = async (url, silent) => {
                const targetUrl = url || gasUrl;
                if (!targetUrl) return { success: false, message: 'GAS URLが未設定です' };

                // 前回の同期がまだ実行中ならスキップ（多重実行防止）
                if (syncInFlightRef.current) {
                    return { success: true, count: 0, merged: [], message: '同期実行中のためスキップ' };
                }
                syncInFlightRef.current = true;
                try {
                    return await syncFromGASInner(targetUrl, silent);
                } finally {
                    syncInFlightRef.current = false;
                }
            };

            const syncFromGASInner = async (targetUrl, silent) => {

                // ローカル更新直後15秒間は同期をスキップ（初期Race Condition対策）
                const lastUpdate = parseInt(localStorage.getItem('timecard_local_update_time') || '0');
                if (Date.now() - lastUpdate < 15000) {
                    return { success: true, count: 0, merged: [], message: 'ローカル更新直後のためスキップ' };
                }

                if (!silent) setSyncStatus(s => ({ ...s, state: 'loading', message: '同期中...' }));
                try {
                    const cb = '&t=' + Date.now();
                    const response = await fetch(targetUrl + '?action=getAll' + cb, { method: 'GET', cache: 'no-store' });
                    if (!response.ok) {
                        if (response.status === 404) {
                            const fallbackUrl = 'https://script.google.com/macros/s/AKfycbwrNlgzheRC5cZ3cFx6lMpduJqTFTvS1F5qevRl1MRGkymYdF49OzxTixlck7SAjMzbeg/exec';
                            if (targetUrl !== fallbackUrl) {
                                setGasUrl(fallbackUrl);
                                localStorage.setItem('timecard_gas_url', fallbackUrl);
                                return syncFromGASInner(fallbackUrl, silent); // 内部関数を直接呼ぶ（多重実行ガードを迂回）
                            }
                        }
                        throw new Error('HTTP ' + response.status);
                    }
                    const data = await response.json();
                    if (data.status !== 'ok') throw new Error(data.message || '不明なエラー');

                    // 通信中にローカル更新が起きた場合はスキップ
                    const checkLastUpdate = parseInt(localStorage.getItem('timecard_local_update_time') || '0');
                    if (Date.now() - checkLastUpdate < 15000) {
                        return { success: true, count: 0, merged: [], message: '通信中にローカル更新が起きたためスキップ' };
                    }

                    // 【型バリデーション】不正型・null・ID欠損レコードを除外してからマージ（障害①対策の強化）
                    const gasRecords = (Array.isArray(data.records) ? data.records : [])
                        .filter(r => r && typeof r === 'object' && typeof r.id === 'string' && r.id);

                    // 【確認ベースのキュー削除】クラウドに反映済み（クラウド側の clientUpdatedAt がキューの値以上）の
                    // レコードだけを未送信キューから削除する。未反映のものはキューに残し、後段で再送する。
                    const cloudCheckMap = {};
                    gasRecords.forEach(r => { if (r && r.id) cloudCheckMap[r.id] = r; });
                    const rawPending = safeParseJSON(localStorage.getItem('timecard_pending_sync'), []);
                    const pending = rawPending.filter(p => {
                        if (!p || !p.id) return false; // 不正エントリは破棄
                        const cloud = cloudCheckMap[p.id];
                        if (!cloud) return true; // クラウド未反映 → キューに残す
                        const pTs = (p.clientUpdatedAt && !isNaN(new Date(p.clientUpdatedAt).getTime())) ? new Date(p.clientUpdatedAt).getTime() : 0;
                        const cTs = (cloud.clientUpdatedAt && !isNaN(new Date(cloud.clientUpdatedAt).getTime())) ? new Date(cloud.clientUpdatedAt).getTime() : 0;
                        return cTs < pTs; // クラウドが古い → まだ未反映なのでキューに残す
                    });
                    if (pending.length !== rawPending.length) {
                        localStorage.setItem('timecard_pending_sync', JSON.stringify(pending));
                    }
                    const pendingMap = {};
                    pending.forEach(p => { pendingMap[p.id] = p; });

                    let finalMerged = [];
                    setTimeRecords(prev => {
                        // ローカルデータをMapに変換
                        const localMap = {};
                        prev.forEach(r => { localMap[r.id] = r; });

                        // クラウドデータをMapに変換
                        const cloudMap = {};
                        gasRecords.forEach(r => { cloudMap[r.id] = r; });

                        // 全IDを集める
                        const allIds = new Set([...Object.keys(localMap), ...Object.keys(cloudMap)]);
                        const merged = [];

                        allIds.forEach(id => {
                            const local = localMap[id];
                            const cloud = cloudMap[id];
                            const isPending = !!pendingMap[id];
                            
                            let winner = null;

                            if (isPending) {
                                // 未送信データはローカルを常に優先
                                winner = pendingMap[id];
                            } else if (local && cloud) {
                                // 両方にある場合: clientUpdatedAt で比較 (クラウドが旧バージョンの場合は serverUpdatedAtMs を使用)
                                const localTs = (local.clientUpdatedAt && !isNaN(new Date(local.clientUpdatedAt).getTime())) ? new Date(local.clientUpdatedAt).getTime() : 0;
                                const cloudTs = (cloud.clientUpdatedAt && !isNaN(new Date(cloud.clientUpdatedAt).getTime())) ? new Date(cloud.clientUpdatedAt).getTime() : (Number(cloud.serverUpdatedAtMs) || 0);
                                winner = (localTs > cloudTs) ? local : cloud;
                            } else if (cloud) {
                                // クラウドのみ → クラウドデータを採用
                                winner = cloud;
                            } else if (local) {
                                // ローカルのみ（クラウド側のシートが削除された場合など）→ ローカルデータを採用
                                winner = local;
                            }

                            // winner が null の場合はスキップ（安全弁）
                            if (!winner) return;

                            // Tombstone（削除済みフラグ）がない場合のみ採用
                            // ※ 古いGASコードが deleted を返さない場合のためのフォールバックとして remarks もチェック
                            const isDeleted = (
                                winner.deleted === true || 
                                winner.deleted === "true" || 
                                (typeof winner.remarks === 'string' && winner.remarks.includes("【完全削除済】"))
                            );

                            if (!isDeleted) {
                                merged.push(winner);
                            }
                        });

                        finalMerged = merged;
                        return merged;
                    });

                    // 同期後にローカルの未送信データも送る
                    await retrySendPending(targetUrl);

                    const now = new Date().toLocaleString('ja-JP');
                    localStorage.setItem('timecard_last_sync', now);
                    setSyncStatus({ state: 'success', message: gasRecords.length + '件を取得しました', lastSync: now });
                    return { success: true, count: gasRecords.length, merged: finalMerged };

                } catch(e) {
                    const msg = e.message || '不明なエラー';
                    setSyncStatus(s => ({ ...s, state: 'error', message: '同期失敗: ' + msg }));
                    // サイレントモードでない場合のみUIエラーを表示（3秒ポーリングでのエラーはスパムにならないよう抑制）
                    if (!silent && onError) onError('FETCH_FAIL', `最新データの取得に失敗しました。打刻は続けられます。\n管理者に「FETCH_FAIL」のエラーが出たとご連絡ください。\n（詳細: ${msg}）`);
                    return { success: false, message: msg };
                }
            };

            // GAS URL変更時・起動時・定期的に自動同期
            useEffect(() => {
                if (gasUrl) {
                    syncFromGAS(gasUrl, true);
                    syncSettingsFromGAS(gasUrl); // 設定情報の同期

                    const intervalId = setInterval(() => {
                        syncFromGAS(gasUrl, true);
                    }, 3000); // 3秒ごとに自動同期して他端末のラグを最小化

                    // 画面にフォーカスが戻ったときに即座に同期
                    const handleFocus = () => { syncFromGAS(gasUrl, true); syncSettingsFromGAS(gasUrl); };
                    const handleVisibility = () => {
                        if (document.visibilityState === 'visible') { syncFromGAS(gasUrl, true); syncSettingsFromGAS(gasUrl); }
                    };
                    window.addEventListener('focus', handleFocus);
                    document.addEventListener('visibilitychange', handleVisibility);

                    return () => {
                        clearInterval(intervalId);
                        window.removeEventListener('focus', handleFocus);
                        document.removeEventListener('visibilitychange', handleVisibility);
                    };
                }
            }, [gasUrl]);

            return { staffList, setStaffList, timeRecords, setTimeRecords, adminPin, setAdminPin, gasUrl, setGasUrl, sendToGAS, deleteFromGAS, syncFromGAS, saveSettingsToGAS, syncSettingsFromGAS, syncStatus, confirmations, confirmMonth };
        };

        // Excel出力時に修正タグを除去して備考をきれいにする（アプリ内の履歴には残る）
        const cleanRemarksForExcel = (text) => {
            if (!text) return '';
            return String(text).replace(/【本人修正済】/g, '').replace(/\s*\/\s*(?=\/|$)/g, '').replace(/\s{2,}/g, ' ').trim();
        };

        const calculateDuration = (start, end) => {
            if (!start || !end) return 0;
            const parse = t => {
                const [h,m,s] = t.split(':').map(Number);
                return (h || 0) * 3600 + (m || 0) * 60 + (s || 0);
            };
            const diff = parse(end) - parse(start);
            return diff > 0 ? diff : 0;
        };
        
        const formatTimeHM = (t) => t ? t.substring(0, 5) : '';

        // --- 時計コンポーネント ---
        const RealtimeClock = () => {
            const [time, setTime] = useState(new Date());
            useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);
            
            const days = ['日', '月', '火', '水', '木', '金', '土'];
            const dateStr = `${time.getFullYear()}年${time.getMonth() + 1}月${time.getDate()}日 (${days[time.getDay()]})`;
            const timeStr = time.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            return (
                <div className="text-center my-4 bg-white/60 p-4 rounded-xl shadow-sm border border-secondary/20">
                    <p className="text-lg text-primary/80 font-bold">{dateStr}</p>
                    <p className="text-5xl font-bold text-primary tabular-nums tracking-widest mt-1">{timeStr}</p>
                </div>
            );
        };

        // --- モーダル: 編集・自己申請フォーム ---
        const EditRecordModal = ({ recordId, dateStr, dayOfWeek, defaultStaffName, initialRecord, onClose, onSave, isAdmin, isPaidLeaveMode }) => {
            const [clockIn, setClockIn] = useState(initialRecord?.clockIn ? formatTimeHM(initialRecord.clockIn) : '');
            const [clockOut, setClockOut] = useState(initialRecord?.clockOut ? formatTimeHM(initialRecord.clockOut) : '');
            const [breakStart, setBreakStart] = useState(initialRecord?.breakStart ? formatTimeHM(initialRecord.breakStart) : '');
            const [breakEnd, setBreakEnd] = useState(initialRecord?.breakEnd ? formatTimeHM(initialRecord.breakEnd) : '');
            const [additionalBreak, setAdditionalBreak] = useState(initialRecord?.additionalBreakMins || 0);
            const [meal, setMeal] = useState(initialRecord?.meal || false);
            const [editTransport, setEditTransport] = useState(initialRecord?.transport != null ? String(initialRecord.transport) : '');
            const [remarks, setRemarks] = useState(initialRecord?.remarks || '');
            const [isPaidLeave, setIsPaidLeave] = useState(initialRecord?.isPaidLeave || isPaidLeaveMode);

            const handleSave = () => {
                if (isPaidLeave) {
                    const confirmLeave = window.confirm(`${dateStr} を【有給申請】で登録しますか？\n（出勤時刻などの入力内容はクリアされます）`);
                    if (!confirmLeave) return;
                } else {
                    if (!clockIn && clockOut) { alert("🚨 エラー：出勤時間が入力されていません！"); return; }
                    if (clockIn && clockOut && clockOut < clockIn) { alert("🚨 エラー：退勤時間は出勤時間より後である必要があります！"); return; }
                    if (breakStart && !breakEnd) { alert("🚨 エラー：中抜けの終了時間がありません！"); return; }
                    if (!breakStart && breakEnd) { alert("🚨 エラー：中抜けの開始時間がありません！"); return; }
                }

                const safeTimeStr = (hm) => hm ? hm + ':00' : null;
                const finalRemarks = remarks.trim();
                let systemAppendedRemarks = finalRemarks;
                
                if (!isAdmin && !isPaidLeave) {
                    if (!systemAppendedRemarks.includes('【本人修正済】')) {
                        systemAppendedRemarks += (systemAppendedRemarks ? ' ' : '') + '【本人修正済】';
                    }
                }

                let finalRecord = {
                    id: recordId, staffName: defaultStaffName, date: dateStr,
                    clockIn: isPaidLeave ? null : safeTimeStr(clockIn),
                    clockOut: isPaidLeave ? null : safeTimeStr(clockOut),
                    breakStart: isPaidLeave ? null : safeTimeStr(breakStart),
                    breakEnd: isPaidLeave ? null : safeTimeStr(breakEnd),
                    additionalBreakMins: isPaidLeave ? 0 : parseInt(additionalBreak) || 0,
                    meal: isPaidLeave ? false : meal,
                    transport: isPaidLeave ? null : (editTransport === '' ? null : (parseInt(editTransport) || 0)),
                    isPaidLeave: isPaidLeave,
                    remarks: systemAppendedRemarks,
                    clientUpdatedAt: new Date().toISOString()
                };
                onSave(finalRecord);
            };

            const handleDelete = () => {
                if (window.confirm(`本当に ${dateStr} のすべての打刻データ（有給申請含む）を取り消してクリアしますか？\n（この操作は元に戻せません）`)) {
                    onSave(null);
                }
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center modal-overlay p-4 animate-fade-in">
                    <div className="bg-white rounded-3xl w-full max-w-md shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                        <div className={`p-4 text-white flex justify-between items-center ${isPaidLeave ? 'bg-sky-500' : 'bg-primary'}`}>
                            <h3 className="font-bold text-lg flex items-center gap-2">
                                {isPaidLeave ? '🏖 有給申請' : '✏️ 打刻データの修正'}
                            </h3>
                            <button onClick={onClose} className="hover:bg-black/20 p-1 rounded-full transition-colors"><CloseIcon /></button>
                        </div>
                        
                        <div className="p-6 overflow-y-auto flex-1">
                            <div className="text-center font-bold text-xl mb-4 border-b-2 border-primary/10 pb-2">
                                {dateStr} ({dayOfWeek})
                            </div>
                            
                            <label className={`block border-2 rounded-xl p-3 mb-6 cursor-pointer transition-colors ${isPaidLeave ? 'border-sky-500 bg-sky-50' : 'border-gray-200 hover:bg-gray-50'}`}>
                                <div className="flex items-center justify-between">
                                    <span className={`font-bold text-lg ${isPaidLeave ? 'text-sky-600' : 'text-gray-500'}`}>🏖 この日を有給申請にする</span>
                                    <input type="checkbox" checked={isPaidLeave} onChange={(e) => setIsPaidLeave(e.target.checked)} className="w-6 h-6 border-2 accent-sky-500" />
                                </div>
                                {isPaidLeave && <p className="text-xs text-sky-600 mt-2">※出力時に「有給申請」として自動記録されます。</p>}
                            </label>

                            {!isPaidLeave && (
                                <div className="space-y-4 animate-fade-in">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-bold text-primary mb-1">出勤</label>
                                            <input type="time" value={clockIn} onChange={(e) => setClockIn(e.target.value)} className="w-full border-2 border-primary/20 rounded-xl p-2 font-bold text-lg focus:border-secondary focus:outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-primary mb-1">退勤</label>
                                            <input type="time" value={clockOut} onChange={(e) => setClockOut(e.target.value)} className="w-full border-2 border-primary/20 rounded-xl p-2 font-bold text-lg focus:border-secondary focus:outline-none" />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4 bg-surface p-3 rounded-xl border border-primary/10">
                                        <div>
                                            <label className="block text-xs font-bold text-primary/70 mb-1">中抜け開始</label>
                                            <input type="time" value={breakStart} onChange={(e) => setBreakStart(e.target.value)} className="w-full border border-primary/20 rounded-lg p-2 font-bold focus:border-secondary focus:outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-primary/70 mb-1">中抜け終了</label>
                                            <input type="time" value={breakEnd} onChange={(e) => setBreakEnd(e.target.value)} className="w-full border border-primary/20 rounded-lg p-2 font-bold focus:border-secondary focus:outline-none" />
                                        </div>
                                    </div>
                                    <div className="flex gap-4 items-end">
                                        <div className="flex-1">
                                            <label className="block text-xs font-bold text-primary mb-1">
                                                {(breakStart && breakEnd) ? '中抜けとは別の休憩（分）' : 'この日の休憩時間（分）'}
                                            </label>
                                            <input type="number" value={additionalBreak} onChange={(e) => setAdditionalBreak(e.target.value)} min="0" className="w-full border-2 border-primary/20 rounded-xl p-2 font-bold text-lg focus:border-secondary focus:outline-none" />
                                            {(breakStart && breakEnd) && (
                                                <p className="text-[10px] text-primary/50 mt-1">※中抜け時間は含まず、その他に取った休憩分数</p>
                                            )}
                                        </div>
                                        <div className="flex-1">
                                            <label className="block text-xs font-bold text-primary mb-1">🚃 交通費（往復・円）</label>
                                            <input type="number" inputMode="numeric" min="0" value={editTransport}
                                                onChange={(e) => setEditTransport(e.target.value.replace(/[^0-9]/g, ''))}
                                                placeholder="なしは空欄"
                                                className="w-full border-2 border-primary/20 p-2 rounded-xl text-right focus:border-secondary" />
                                        </div>
                                        <label className="flex-1 flex items-center justify-center space-x-2 cursor-pointer border-2 border-primary/20 rounded-xl p-2 hover:bg-surface transition-colors">
                                            <input type="checkbox" checked={meal} onChange={(e) => setMeal(e.target.checked)} className="w-5 h-5 accent-secondary" />
                                            <span className="font-bold text-primary">🥗 賄い</span>
                                        </label>
                                    </div>
                                </div>
                            )}

                            <div className="mt-4">
                                <label className="block text-xs font-bold text-primary mb-1">備考</label>
                                <textarea value={remarks} onChange={(e) => setRemarks(e.target.value)} rows="3" placeholder="コメントや申請理由など..." className="w-full border-2 border-primary/20 rounded-xl p-2 text-sm focus:border-secondary focus:outline-none resize-none"></textarea>
                                {!isAdmin && !isPaidLeave && (
                                    <div className="mt-2 p-2 bg-amber-50 rounded text-xs text-amber-700 font-bold border border-amber-200">
                                        ⚠️ 保存した場合、日付の備考欄に「本人修正済」と記録が残ります。
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="p-4 border-t-2 border-primary/10 bg-gray-50 flex justify-between gap-3">
                            <button onClick={handleDelete} className="px-4 py-3 text-sm font-bold text-danger hover:bg-danger/10 rounded-xl transition-colors">
                                完全取消
                            </button>
                            <div className="flex gap-2 w-full justify-end">
                                <button onClick={onClose} className="px-5 py-3 text-sm font-bold text-primary bg-white border-2 border-primary/20 rounded-xl hover:bg-gray-100 transition-colors">
                                    キャンセル
                                </button>
                                <button onClick={handleSave} className="px-6 py-3 text-sm font-bold text-white bg-primary rounded-xl hover:bg-primary/90 transition-colors shadow-md">
                                    保存する
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- カレンダー・履歴マネージャー ---
        const MonthlyTimeEditor = ({ staffName, isAdmin, timeRecords, setTimeRecords, sendToGAS, deleteFromGAS, onBack, confirmations, onConfirmMonth }) => {
            const [selectedMonth, setSelectedMonth] = useState(() => {
                const now = new Date(); return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            });
            const [editModalData, setEditModalData] = useState(null);

            const [yearStr, monthStr] = selectedMonth.split('-');
            const year = parseInt(yearStr);
            const month = parseInt(monthStr);
            const daysInMonth = new Date(year, month, 0).getDate();

            const handleSaveRecord = (newRecord) => {
                const recordId = editModalData.recordId;
                if (newRecord === null) {
                    setTimeRecords(prev => prev.filter(r => r.id !== recordId));
                    if (deleteFromGAS) deleteFromGAS(recordId);
                } else {
                    setTimeRecords(prev => [...prev.filter(r => r.id !== recordId), newRecord]);
                    if (sendToGAS) sendToGAS(newRecord);
                }
                setEditModalData(null);
            };

            const renderTableRows = () => {
                const rows = [];
                for (let d = 1; d <= daysInMonth; d++) {
                    const dateObj = new Date(year, month - 1, d);
                    const dayOfWeek = ['日', '月', '火', '水', '木', '金', '土'][dateObj.getDay()];
                    const rowBgClass = dateObj.getDay() === 0 ? 'bg-red-50' : dateObj.getDay() === 6 ? 'bg-blue-50' : 'bg-white hover:bg-surface transition-colors cursor-pointer';

                    const dateStrLong = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    const recordId = `${staffName}_${dateStrLong}`;
                    const record = timeRecords.find(r => r.id === recordId);

                    rows.push(
                        <tr key={d} className={`border-b border-primary/10 ${rowBgClass}`} onClick={() => setEditModalData({ recordId, dateStr: dateStrLong, dayOfWeek, record, isPaidLeaveMode: false })}>
                            <td className="p-3 text-center border-r border-primary/10 font-bold whitespace-nowrap">
                                {d} <span className="text-xs text-gray-500">({dayOfWeek})</span>
                            </td>
                            {record ? (
                                record.isPaidLeave ? (
                                    <>
                                        <td className="p-3 text-center text-primary/30">-</td>
                                        <td className="p-3 text-center text-primary/30">-</td>
                                        <td className="p-3 text-center text-primary/30">-</td>
                                        <td className="p-3 text-center text-primary/30">-</td>
                                        <td className="p-3 text-center text-primary/30">-</td>
                                        <td className="p-3 text-center text-primary/30">-</td>
                                        <td className="p-2 text-center text-sm font-bold text-sky-600 truncate max-w-[100px]" title={record.remarks}>
                                            【有給申請】 {record.remarks}
                                        </td>
                                        <td className="p-2 text-center">
                                            <button className="text-xs bg-primary/10 hover:bg-primary/20 text-primary font-bold py-1 px-3 rounded-lg transition-colors shadow-sm whitespace-nowrap">修正</button>
                                        </td>
                                    </>
                                ) : (
                                    <>
                                        <td className="p-3 text-center font-bold text-primary">{formatTimeHM(record.clockIn) || '-'}</td>
                                        <td className="p-3 text-center font-bold text-[#b45309]">{formatTimeHM(record.clockOut) || '-'}</td>
                                        <td className="p-3 text-center text-xs text-primary/70">
                                            {(record.breakStart && record.breakEnd)
                                                ? <span>{formatTimeHM(record.breakStart)}〜{formatTimeHM(record.breakEnd)}</span>
                                                : <span className="text-primary/30">-</span>}
                                        </td>
                                        <td className="p-3 text-center text-xs">
                                            {(() => {
                                                if (!record.clockOut) return <span className="text-primary/20">-</span>;
                                                const addMins = parseInt(record.additionalBreakMins) || 0;
                                                const hasMiddleBreak = record.breakStart && record.breakEnd;

                                                // 中抜け時間（分）を計算
                                                let middleBreakMins = 0;
                                                if (hasMiddleBreak) {
                                                    const mbSec = calculateDuration(record.breakStart, record.breakEnd);
                                                    middleBreakMins = Math.round(mbSec / 60);
                                                }

                                                const totalMins = middleBreakMins + addMins;

                                                if (addMins > 0) {
                                                    // ユーザーが入力あり → 合計をオレンジで表示
                                                    return <span className="font-bold text-accent">{totalMins}分</span>;
                                                }
                                                if (hasMiddleBreak) {
                                                    // 中抜けのみ → 中抜け時間をグレーで表示
                                                    return <span className="text-primary/50">{middleBreakMins}分</span>;
                                                }
                                                // 中抜けなし・additionalBreakMins=0 → 旧データ対応で自動推定
                                                // ただし additionalBreakMins が明示的に存在する場合（0含む）は旧データではないのでそのまま0分表示
                                                if (record.additionalBreakMins !== undefined && record.additionalBreakMins !== null) {
                                                    return <span className="text-primary/40">0分</span>;
                                                }
                                                if (record.clockIn) {
                                                    const workSec = calculateDuration(record.clockIn, record.clockOut);
                                                    if (workSec >= 6 * 3600) {
                                                        return <span className="text-primary/50">45分</span>;
                                                    }
                                                }
                                                return <span className="text-primary/40">0分</span>;
                                            })()}
                                        </td>
                                        <td className="p-3 text-center">{record.meal ? '🥗' : '-'}</td>
                                        <td className="p-3 text-center text-sm font-bold text-sky-700">{record.transport != null && record.transport !== '' ? Number(record.transport).toLocaleString() + '円' : <span className="text-primary/30 font-normal">-</span>}</td>
                                        <td className="p-2 text-xs truncate max-w-[100px] text-gray-500 relative">
                                            {record.remarks?.includes('【本人修正済】') ? (
                                                <span className="bg-amber-100 text-amber-700 px-1 py-0.5 rounded text-[10px] font-bold inline-block mr-1" title={record.remarks}>修正済</span>
                                            ) : ''}
                                            {record.remarks?.replace('【本人修正済】', '').trim() || '-'}
                                        </td>
                                        <td className="p-2 text-center">
                                            <button className="text-xs bg-primary/10 hover:bg-primary/20 text-primary font-bold py-1 px-3 rounded-lg transition-colors shadow-sm whitespace-nowrap">修正</button>
                                        </td>
                                    </>
                                )
                            ) : (
                                <>
                                    <td className="p-3"></td>
                                    <td className="p-3"></td>
                                    <td className="p-3"></td>
                                    <td className="p-3"></td>
                                    <td className="p-3"></td>
                                    <td className="p-3"></td>
                                    <td className="p-3"></td>
                                    <td className="p-2 text-center opacity-0 group-hover:opacity-100 transition-opacity" style={{opacity: 1}}>
                                        <div className="flex gap-1 justify-center">
                                            {!isAdmin && (
                                                <button onClick={(e) => { e.stopPropagation(); setEditModalData({ recordId, dateStr: dateStrLong, dayOfWeek, record: null, isPaidLeaveMode: true }); }} className="text-xs bg-sky-50 shadow-sm text-sky-600 font-bold py-1 px-2 rounded-lg hover:bg-sky-100 whitespace-nowrap border border-sky-200">有給</button>
                                            )}
                                            <button className="text-xs bg-white border border-primary/20 shadow-sm text-primary font-bold py-1 px-2 rounded-lg hover:bg-surface whitespace-nowrap">新規・修正</button>
                                        </div>
                                    </td>
                                </>
                            )}
                        </tr>
                    );
                }
                return rows;
            };

            return (
                <div className="animate-fade-in space-y-4 w-full text-left relative z-10">
                    <div className="flex justify-between items-center mb-6">
                        <button onClick={onBack} className="text-sm border-2 border-primary/20 bg-white hover:bg-gray-50 font-bold px-4 py-2 rounded-xl text-primary transition-colors flex items-center gap-1 shadow-sm">
                            ← {isAdmin ? '管理者メニューへ戻る' : '打刻画面へ戻る'}
                        </button>
                        <h2 className="text-xl font-bold text-primary flex items-center gap-1">
                            {isAdmin ? '🔧' : '📊'} 履歴・修正
                        </h2>
                    </div>

                    <div className="bg-white p-5 rounded-3xl border-2 border-primary/20 shadow-sm">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                            <div className="flex-1">
                                <p className="text-sm font-bold text-primary/60 mb-1">対象スタッフ</p>
                                <p className="text-2xl font-bold text-primary">{staffName} さん</p>
                            </div>
                            <div>
                                <input 
                                    type="month" 
                                    value={selectedMonth}
                                    onChange={(e) => setSelectedMonth(e.target.value)}
                                    className="border-2 border-primary/30 text-lg p-2 rounded-xl font-bold focus:border-secondary focus:outline-none bg-surface"
                                />
                            </div>
                        </div>

                        {!isAdmin && (
                            <div className="mb-4 bg-amber-50 border border-amber-200 p-3 rounded-xl text-xs text-amber-800 font-bold">
                                💡 出勤・退勤の押し忘れ等は、カレンダーの行をタップ（クリック）して自分で修正できます。<br/>
                                🏖 「有給」を申請する場合は、空いている日をタップして「🏖 有給」を押してください。
                            </div>
                        )}

                        <div className="overflow-x-auto rounded-xl border-2 border-primary/10 shadow-inner max-h-[60vh] overflow-y-auto w-full">
                            <table className="w-full text-left border-collapse" style={{ minWidth: '700px' }}>
                                <thead className="bg-primary/5 sticky top-0 z-10 shadow-sm">
                                    <tr>
                                        <th className="p-3 font-bold text-sm text-primary text-center whitespace-nowrap w-24">日付</th>
                                        <th className="p-3 font-bold text-sm text-primary text-center whitespace-nowrap w-20">出勤</th>
                                        <th className="p-3 font-bold text-sm text-primary text-center whitespace-nowrap w-20">退勤</th>
                                        <th className="p-3 font-bold text-sm text-primary text-center whitespace-nowrap w-20">中抜け</th>
                                        <th className="p-3 font-bold text-sm text-primary text-center whitespace-nowrap w-16">休憩</th>
                                        <th className="p-3 font-bold text-sm text-primary text-center whitespace-nowrap w-16">賄い</th>
                                        <th className="p-3 font-bold text-sm text-primary text-center whitespace-nowrap w-20">交通費</th>
                                        <th className="p-3 font-bold text-sm text-primary whitespace-nowrap max-w-[150px]">備考・ログ</th>
                                        <th className="p-3 font-bold text-sm text-primary text-center whitespace-nowrap w-32">操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {renderTableRows()}
                                </tbody>
                            </table>
                        </div>

                        {(() => {
                            const monthRecs = timeRecords.filter(r => r.staffName === staffName && r.date && r.date.startsWith(selectedMonth) && !r.isPaidLeave);
                            const transportTotal = monthRecs.reduce((a, r) => a + (r.transport != null ? (parseInt(r.transport) || 0) : 0), 0);
                            const workDays = monthRecs.filter(r => r.clockIn).length;
                            const confirmedAt = confirmations ? confirmations[`${staffName}|${selectedMonth}`] : null;
                            return (
                                <div className="mt-4 space-y-3">
                                    <div className="flex flex-wrap gap-3 justify-end items-center bg-surface border-2 border-primary/10 rounded-xl p-3">
                                        <span className="text-sm font-bold text-primary/70">出勤 {workDays}日</span>
                                        <span className="text-lg font-bold text-sky-700">🚃 交通費 月間合計: {transportTotal.toLocaleString()}円</span>
                                    </div>
                                    {!isAdmin && onConfirmMonth && (
                                        <div className="bg-amber-50 border-2 border-amber-300 rounded-xl p-3 text-center">
                                            <p className="text-xs text-amber-800 font-bold mb-2">
                                                月末に内容（時間・交通費・賄い）を確認して、このボタンを押してください。<br/>
                                                ここに記載の内容がそのまま給与に反映されます。
                                            </p>
                                            <button onClick={() => {
                                                if (window.confirm(`${selectedMonth.replace('-', '年')}月分の打刻・交通費の内容を確認しましたか？
この内容がそのまま給与計算に使われます。`)) {
                                                    onConfirmMonth(staffName, selectedMonth);
                                                }
                                            }} className="bg-gradient-to-r from-amber-400 to-orange-400 hover:brightness-110 text-white font-bold py-3 px-6 rounded-xl shadow border-b-4 border-orange-600 active:scale-95 transition-all">
                                                ✅ 今月分を確認しました
                                            </button>
                                            {confirmedAt && <p className="text-xs text-emerald-700 font-bold mt-2">確認済み: {confirmedAt}（押し直すと更新されます）</p>}
                                        </div>
                                    )}
                                    {isAdmin && confirmedAt && (
                                        <p className="text-right text-xs text-emerald-700 font-bold">✅ 本人確認済み: {confirmedAt}</p>
                                    )}
                                </div>
                            );
                        })()}
                    </div>

                    {editModalData && (
                        <EditRecordModal 
                            recordId={editModalData.recordId}
                            dateStr={editModalData.dateStr}
                            dayOfWeek={editModalData.dayOfWeek}
                            defaultStaffName={staffName}
                            initialRecord={editModalData.record}
                            isAdmin={isAdmin}
                            isPaidLeaveMode={editModalData.isPaidLeaveMode}
                            onClose={() => setEditModalData(null)}
                            onSave={handleSaveRecord}
                        />
                    )}
                </div>
            );
        };

        // --- 管理者ダッシュボードコンポーネント ---
        const AdminDashboard = ({ 
            staffList, setStaffList, 
            timeRecords, setTimeRecords, 
            adminPin, setAdminPin,
            gasUrl, setGasUrl,
            syncFromGAS, saveSettingsToGAS, syncStatus,
            openAdminHistoryView, confirmations 
        }) => {
            const [targetMonth, setTargetMonth] = useState(() => {
                const now = new Date(); return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            });
            const [newStaffName, setNewStaffName] = useState('');
            // fileInputRef は不要になりました（テンプレート埋め込み済み）

            const handleAddStaff = () => {
                if (newStaffName && !staffList.find(s => s.name === newStaffName)) {
                    const newList = [...staffList, { name: newStaffName, defaultMeal: false, isOutsourced: false, hourlyRate: 1200, dailyTransport: 0 }];
                    setStaffList(newList);
                    saveSettingsToGAS(newList, adminPin);
                    setNewStaffName('');
                } else if(staffList.find(s => s.name === newStaffName)) {
                    alert('すでに同じ名前のスタッフがいます。');
                }
            };

            const toggleMealSetting = (name) => {
                const newList = staffList.map(s => s.name === name ? { ...s, defaultMeal: !s.defaultMeal } : s);
                setStaffList(newList);
                saveSettingsToGAS(newList, adminPin);
            };
            const toggleOutsourced = (name) => {
                const newList = staffList.map(s => s.name === name ? { ...s, isOutsourced: !s.isOutsourced } : s);
                setStaffList(newList);
                saveSettingsToGAS(newList, adminPin);
            };
            // debounce用タイマーRef（時給・交通費の入力で1文字ごとにGAS送信されるのを防止）
            const settingsSaveTimerRef = useRef(null);
            const debouncedSaveSettingsToGAS = (newList, pin) => {
                if (settingsSaveTimerRef.current) clearTimeout(settingsSaveTimerRef.current);
                settingsSaveTimerRef.current = setTimeout(() => {
                    saveSettingsToGAS(newList, pin);
                }, 500);
            };
            const updateHourlyRate = (name, val) => {
                const newList = staffList.map(s => s.name === name ? { ...s, hourlyRate: parseInt(val) || 0 } : s);
                setStaffList(newList);
                debouncedSaveSettingsToGAS(newList, adminPin);
            };
            const updateDailyTransport = (name, val) => {
                const newList = staffList.map(s => s.name === name ? { ...s, dailyTransport: parseInt(val) || 0 } : s);
                setStaffList(newList);
                debouncedSaveSettingsToGAS(newList, adminPin);
            };
            const handleRemoveStaff = (name) => {
                if (window.confirm(`${name}さんを削除しますか？\n（過去の打刻データは消えませんが、プルダウンに表示されなくなります）`)) {
                    const newList = staffList.filter(s => s.name !== name);
                    setStaffList(newList);
                    saveSettingsToGAS(newList, adminPin);
                }
            };

            // スタッフの表示順を1つ上/下に移動（おなまえプルダウン・スタッフ設定一覧の並び順に反映される）
            const moveStaff = (name, dir) => {
                const index = staffList.findIndex(s => s.name === name);
                const target = index + dir;
                if (index === -1 || target < 0 || target >= staffList.length) return;
                const newList = [...staffList];
                [newList[index], newList[target]] = [newList[target], newList[index]];
                setStaffList(newList);
                saveSettingsToGAS(newList, adminPin);
            };
            
            const handleUpdatePin = () => {
                const newPin = window.prompt("新しい管理者用パスワード（4桁の数字）を入力してください：\n（忘れないようにご注意ください）");
                if (newPin) {
                    if (newPin.length !== 4 || isNaN(newPin)) {
                        alert("パスワードは4桁の半角数字で入力してください。");
                    } else {
                        setAdminPin(newPin);
                        saveSettingsToGAS(staffList, newPin);
                        alert(`パスワードを ${newPin} に変更しました。`);
                    }
                }
            };

            // 見た目がそっくりな異体字（例: はしご高「髙」と標準の「高」）を吸収して有給管理表の名前と照合する。
            // GAS側(gas_backup.gs)の normalizeNameForMatch と同じ変換ルールにしておくこと。
            const KANJI_VARIANTS_JS = [
                ['髙', '高'], ['﨑', '崎'], ['齋', '斎'], ['斉', '斎'], ['邊', '辺'], ['邉', '辺'], ['櫻', '桜'],
            ];
            const normalizeNameForMatch = (name) => {
                let s = String(name || '').trim();
                for (const [from, to] of KANJI_VARIANTS_JS) s = s.split(from).join(to);
                return s;
            };

            const handleExportWithTemplate = async () => {
                try {
                    const [yearStr, monthStr] = targetMonth.split('-');
                    const year = parseInt(yearStr);
                    const month = parseInt(monthStr);

                    // 出力前にクラウド（スプレッドシート）との同期と、有給管理表の取得を並行実行する
                    // （直列にすると出力が体感1分近く遅くなるため、同時に走らせて待ち時間を短縮する）
                    let leaveInfo = {};
                    if (gasUrl) {
                        const [syncOutcome, leaveOutcome] = await Promise.allSettled([
                            syncFromGAS(gasUrl),
                            fetch(gasUrl + '?action=getLeaveInfo&year=' + year).then(r => r.json()),
                        ]);

                        // クラウド同期の結果を確認
                        if (syncOutcome.status === 'rejected') {
                            const proceed = window.confirm(
                                    `【警告】クラウドとの自動同期中にエラーが発生しました。\n` +
                                    `（エラー: ${syncOutcome.reason?.message || '不明なエラー'}）\n\n` +
                                    `最新の打刻データが反映されていない可能性があります。\n` +
                                    `ローカルに保存されている古いデータ（キャッシュ）のままExcelを出力しますか？`
                            );
                            if (!proceed) return;
                        } else if (!syncOutcome.value || !syncOutcome.value.success) {
                            const proceed = window.confirm(
                                `【警告】クラウドとの自動同期に失敗しました。\n` +
                                `（理由: ${syncOutcome.value ? syncOutcome.value.message : '通信エラー'}）\n\n` +
                                `最新の打刻データが反映されていない可能性があります。\n` +
                                `ローカルに保存されている古いデータ（キャッシュ）のままExcelを出力しますか？`
                            );
                            if (!proceed) return;
                        }

                        // 有給休暇の残日数・次回付与日（オーナー管轄の有給管理表・読み取り専用）
                        // 管理表は年ごとに新しいファイル（例:「年次有給休暇管理簿2027」）になるため、
                        // 対象月の年で毎回ドライブ内を検索する（IDは指定しない）。
                        if (leaveOutcome.status === 'rejected') {
                            console.warn('有給管理表の取得に失敗しました。有給欄は空欄で出力します。', leaveOutcome.reason);
                            alert(
                                `⚠️ 有給管理表への接続に失敗しました\n\n` +
                                `（エラー: ${leaveOutcome.reason?.message || '不明なエラー'}）\n\n` +
                                `このままExcel出力は続行しますが、有給の残日数・次回付与日は空欄になります。`
                            );
                        } else if (leaveOutcome.value.status === 'ok') {
                            if (leaveOutcome.value.found && leaveOutcome.value.leaveInfo) {
                                leaveInfo = leaveOutcome.value.leaveInfo;
                            } else {
                                alert(
                                    `⚠️ 有給管理表が見つかりませんでした\n\n` +
                                    `Googleドライブの「有給」フォルダ内に「年次有給休暇管理簿${year}」という名前のファイルが見つかりません。\n` +
                                    `ファイル名・保存場所を確認してください。\n\n` +
                                    `（このままExcel出力は続行しますが、有給の残日数・次回付与日は空欄になります）`
                                );
                            }
                        }
                    }

                    const workbook = new ExcelJS.Workbook();

                    // Base64テンプレートをデコードしてバッファに変換
                    const b64 = EXCEL_TEMPLATE_B64;
                    const binaryStr = atob(b64);
                    const bytes = new Uint8Array(binaryStr.length);
                    for (let i = 0; i < binaryStr.length; i++) {
                        bytes[i] = binaryStr.charCodeAt(i);
                    }
                    const buffer = bytes.buffer;
                    await workbook.xlsx.load(buffer);

                    const daysInMonth = new Date(year, month, 0).getDate();
                    const timeToExcelFraction = (timeStr) => {
                        if (!timeStr) return null;
                        const parts = timeStr.split(':');
                        const h = parseInt(parts[0], 10) || 0;
                        const m = parseInt(parts[1], 10) || 0;
                        const s = parseInt(parts[2], 10) || 0;
                        return (h * 3600 + m * 60 + s) / 86400;
                    };

                    // ステップ1: 全シートの日付・曜日・データセルを対象月に書き換え
                    workbook.eachSheet((ws) => {
                        // ヘッダー行を探す（「出勤」「退勤」「曜日」を含む行）
                        let startRow = -1;
                        ws.eachRow((row, rowNumber) => {
                            if (startRow !== -1) return;
                            let isHeader = false;
                            row.eachCell((cell) => {
                                const v = cell.value;
                                if (typeof v === 'string' && (v.includes('出勤') || v.includes('曜日') || v.includes('退勤'))) {
                                    isHeader = true;
                                }
                            });
                            if (isHeader) startRow = rowNumber + 1;
                        });
                        // ヘッダーが見つからない場合はデータ行を自動検出
                        if (startRow === -1) {
                            ws.eachRow((row, rowNumber) => {
                                if (startRow !== -1) return;
                                const cellA = row.getCell(1).value;
                                if (cellA instanceof Date || (typeof cellA === 'number' && cellA > 40000)) {
                                    startRow = rowNumber;
                                }
                            });
                        }
                        if (startRow === -1) return; // データ行が見つからないシートはスキップ

                        for (let d = 1; d <= 31; d++) {
                            const row = ws.getRow(startRow + d - 1);
                            // 全書き込み対象セルをクリア
                            [1,2,3,4,5,6,7,11,16,17].forEach(c => { row.getCell(c).value = null; });

                            if (d <= daysInMonth) {
                                const targetDateObj = new Date(year, month - 1, d);
                                const dateVal = new Date(Date.UTC(year, month - 1, d, 12, 0, 0));
                                row.getCell(1).value = dateVal;
                                row.getCell(1).numFmt = 'yyyy/m/d';
                                row.getCell(2).value = ['日', '月', '火', '水', '木', '金', '土'][targetDateObj.getDay()];
                            }
                        }
                    });

                    // ステップ2: staffListに登録されたスタッフのシートに勤怠データを書き込み
                    staffList.filter(s => !s.isOutsourced).forEach(staff => {
                        let ws = workbook.getWorksheet(staff.name);

                        // ===== 完全一致のシートがない場合のハイブリッド対応 =====
                        if (!ws) {
                            // 1. リネーム追従：名前の部分一致シートを探す
                            let fallbackWs = null;
                            workbook.eachSheet((sheet) => {
                                if (sheet.name !== 'マスタ' && sheet.name.length > 0 && staff.name.includes(sheet.name)) {
                                    if (!fallbackWs) fallbackWs = sheet;
                                }
                            });
                            if (fallbackWs) {
                                fallbackWs.name = staff.name; // 旧シートをフルネームにリネーム
                                ws = fallbackWs;
                            }
                        }

                        if (!ws) {
                            // 2. 新規作成：「マスタ」シートから丸ごとコピーして新規生成
                            const masterWs = workbook.getWorksheet('マスタ');
                            if (masterWs) {
                                ws = workbook.addWorksheet(staff.name);
                                // マスタの列幅・スタイルをコピー
                                masterWs.columns.forEach((col, index) => {
                                    const newCol = ws.getColumn(index + 1);
                                    if (col.width) newCol.width = col.width;
                                    if (col.style) newCol.style = col.style;
                                });
                                // 行の高さ・セル値・スタイルをコピー
                                masterWs.eachRow({ includeEmpty: true }, (row, rowNumber) => {
                                    const newRow = ws.getRow(rowNumber);
                                    if (row.height) newRow.height = row.height;
                                    row.eachCell({ includeEmpty: true }, (cell, colNumber) => {
                                        const newCell = newRow.getCell(colNumber);
                                        newCell.value = cell.value;
                                        newCell.style = cell.style;
                                    });
                                });
                                // 結合セルをコピー
                                if (masterWs.model.merges) {
                                    masterWs.model.merges.forEach(merge => ws.mergeCells(merge));
                                }
                                
                                // 新規シートの日付セル等を今月に更新
                                let sRow = -1;
                                ws.eachRow((r, rNum) => {
                                    if (sRow !== -1) return;
                                    let isH = false;
                                    r.eachCell(c => {
                                        if (typeof c.value === 'string' && (c.value.includes('出勤') || c.value.includes('曜日'))) isH = true;
                                    });
                                    if (isH) sRow = rNum + 1;
                                });
                                if (sRow === -1) sRow = 2;

                                for (let d = 1; d <= 31; d++) {
                                    const r = ws.getRow(sRow + d - 1);
                                    [1,2,3,4,5,6,7,11,16,17].forEach(c => { r.getCell(c).value = null; });
                                    if (d <= daysInMonth) {
                                        const tDateObj = new Date(year, month - 1, d);
                                        const dVal = new Date(Date.UTC(year, month - 1, d, 12, 0, 0));
                                        r.getCell(1).value = dVal;
                                        r.getCell(1).numFmt = 'yyyy/m/d';
                                        r.getCell(2).value = ['日', '月', '火', '水', '木', '金', '土'][tDateObj.getDay()];
                                    }
                                }
                            }
                        }

                        if (!ws) {
                            console.warn(`テンプレート内に「マスタ」がないため、${staff.name} さんのシートを生成できません。`);
                            return;
                        }

                        let startRow = -1;
                        ws.eachRow((row, rowNumber) => {
                            if (startRow !== -1) return;
                            let isHeader = false;
                            row.eachCell((cell) => {
                                const v = cell.value;
                                if (typeof v === 'string' && (v.includes('出勤') || v.includes('曜日') || v.includes('退勤'))) {
                                    isHeader = true;
                                }
                            });
                            if (isHeader) startRow = rowNumber + 1;
                        });
                        if (startRow === -1) {
                            ws.eachRow((row, rowNumber) => {
                                if (startRow !== -1) return;
                                const cellA = row.getCell(1).value;
                                if (cellA instanceof Date) startRow = rowNumber;
                            });
                        }
                        if (startRow === -1) startRow = 2;

                        // P列ヘッダー「交通費」（税理士様式に既にある場合は上書きしない）
                        try { const hr0 = ws.getRow(startRow - 1); if (!hr0.getCell(16).value) hr0.getCell(16).value = '交通費'; } catch (e) {}

                        for (let d = 1; d <= daysInMonth; d++) {
                            const row = ws.getRow(startRow + d - 1);
                            const targetDateStrShort = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                            const record = timeRecords.find(r => r.id === `${staff.name}_${targetDateStrShort}`);

                            if (record) {
                                if (record.isPaidLeave) {
                                    row.getCell(17).value = ('【有給申請】 ' + cleanRemarksForExcel(record.remarks)).trim();
                                } else {
                                    row.getCell(3).value = timeToExcelFraction(record.clockIn);
                                    row.getCell(6).value = timeToExcelFraction(record.clockOut);
                                    row.getCell(7).value = record.meal ? 1 : null;

                                    let remarks = record.remarks || '';
                                    // 中抜け欄は実際の打刻データのみ記入
                                    row.getCell(4).value = timeToExcelFraction(record.breakStart);
                                    row.getCell(5).value = timeToExcelFraction(record.breakEnd);

                                    row.getCell(16).value = (record.transport !== undefined && record.transport !== null) ? Number(record.transport) : null;
                                    row.getCell(17).value = cleanRemarksForExcel(remarks) || null;

                                    // K列(col11)に合計休憩時間を書き込む
                                    if (record.clockIn && record.clockOut) {
                                        const addMins = parseInt(record.additionalBreakMins) || 0;
                                        let middleBreakMins = 0;
                                        if (record.breakStart && record.breakEnd) {
                                            const bsF = timeToExcelFraction(record.breakStart);
                                            const beF = timeToExcelFraction(record.breakEnd);
                                            if (bsF !== null && beF !== null) {
                                                middleBreakMins = Math.round((beF - bsF) * 24 * 60);
                                            }
                                        }
                                        let totalBreakMins = middleBreakMins + addMins;
                                        // 旧データ対応: additionalBreakMinsフィールドが存在しない(undefined/null)かつ中抜けなしの場合のみ6時間ルールを適用
                                        // additionalBreakMinsが明示的に0の場合はユーザーが入力した値なのでそのまま
                                        if (totalBreakMins === 0 && (record.additionalBreakMins === undefined || record.additionalBreakMins === null)) {
                                            const ciF = timeToExcelFraction(record.clockIn);
                                            const coF = timeToExcelFraction(record.clockOut);
                                            if (ciF !== null && coF !== null) {
                                                let workFrac = coF - ciF;
                                                if (workFrac < 0) workFrac += 1;
                                                if (workFrac >= 6 / 24) totalBreakMins = 45;
                                            }
                                        }
                                        if (totalBreakMins >= 0) {
                                            row.getCell(11).value = totalBreakMins / 60 / 24;
                                            row.getCell(11).numFmt = 'h:mm';
                                        }
                                    }
                                }
                            }
                        }

                        // ===== 交通費 月間合計（SUM関数）＋本人確認日時 =====
                        // 税理士様式は P33「交通費」見出し・P34「=SUM(P2:P32)」を既に内蔵しているため、
                        // 無ければ補完するだけに留め、既存の書式（太字・色）は変更しない。
                        try {
                            const labelRow = ws.getRow(startRow + 31);   // 見出し行（33行目）
                            if (!labelRow.getCell(16).value) labelRow.getCell(16).value = '交通費';
                            const sumRow = ws.getRow(startRow + 32);     // 合計値行（34行目）
                            if (!sumRow.getCell(16).value) {
                                sumRow.getCell(16).value = { formula: `SUM(P${startRow}:P${startRow + 30})` };
                                sumRow.getCell(16).numFmt = '#,##0"円"';
                            }
                            const confKey = `${staff.name}|${year}-${String(month).padStart(2, '0')}`;
                            const confAt = (confirmations && confirmations[confKey]) || null;
                            const confRow = ws.getRow(startRow + 34);    // 1行空けた36行目相当
                            confRow.getCell(16).value = confAt ? `本人確認済み: ${confAt}` : '本人確認: 未';
                        } catch (e) { console.warn('交通費合計の書き込みに失敗', e); }

                        // ===== 有給休暇（オーナー管轄の有給管理表から取得した値を反映） =====
                        // 「今月の消化日数」はアプリの打刻データから、「残日数・次回付与日」は
                        // オーナーが手作業で更新している有給管理表（正本）から取得する。ここでは読み取るのみ。
                        try {
                            const leaveRow33 = ws.getRow(startRow + 31); // 33行目相当
                            const leaveRow34 = ws.getRow(startRow + 32); // 34行目相当
                            leaveRow33.getCell(1).value = '有休消化';
                            leaveRow33.getCell(3).value = '残有休日数';
                            leaveRow34.getCell(3).value = '次回発生';

                            const usedThisMonth = timeRecords.filter(r =>
                                r.id && r.id.startsWith(`${staff.name}_${year}-${String(month).padStart(2, '0')}`) && r.isPaidLeave
                            ).length;
                            leaveRow33.getCell(2).value = usedThisMonth;

                            const info = leaveInfo && leaveInfo[normalizeNameForMatch(staff.name)];
                            if (info) {
                                leaveRow33.getCell(5).value = (info.remainingDays !== undefined && info.remainingDays !== null && info.remainingDays !== '')
                                    ? `${info.remainingDays}日` : '';
                                leaveRow34.getCell(5).value = info.nextGrantDate
                                    ? String(info.nextGrantDate).replace(/\//g, '.').replace(/\.0(\d)/g, '.$1')
                                    : '';
                            } else {
                                leaveRow33.getCell(5).value = '未登録';
                                leaveRow34.getCell(5).value = '';
                            }
                        } catch (e) { console.warn('有給欄の書き込みに失敗', e); }
                    });

                    // ステップ3: 対象月に出勤記録がないスタッフのシートを削除
                    // マスタシートは常に残す
                    const sheetsToRemove = [];
                    workbook.eachSheet((ws) => {
                        const sheetName = ws.name;
                        if (sheetName === 'マスタ') return; // マスタは残す

                        // このシートのスタッフに対象月のレコードがあるか確認
                        let hasRecord = false;
                        for (let d = 1; d <= daysInMonth; d++) {
                            const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                            const record = timeRecords.find(r => r.id === `${sheetName}_${dateStr}`);
                            if (record) {
                                hasRecord = true;
                                break;
                            }
                        }
                        if (!hasRecord) sheetsToRemove.push(sheetName);
                    });

                    // シートを削除（逆順で削除して安全に処理）
                    sheetsToRemove.forEach(name => {
                        const ws = workbook.getWorksheet(name);
                        if (ws) workbook.removeWorksheet(ws.id);
                    });

                    const outBuffer = await workbook.xlsx.writeBuffer();
                    const blob = new Blob([outBuffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
                    
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = `タイムカード入力_${year}${String(month).padStart(2, '0')}給与分_アプリ出力.xlsx`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    alert('出力に成功しました！');
                } catch (error) {
                    console.error(error);
                    alert("出力中にエラーが発生しました。");
                }
            };

            // ===== 外注者専用エクセル出力（給与計算付き）=====
            const handleExportOutsourced = async () => {
                try {
                    // 出力前にクラウド（スプレッドシート）と自動同期を試みる
                    if (gasUrl) {
                        try {
                            const syncRes = await syncFromGAS(gasUrl);
                            if (!syncRes || !syncRes.success) {
                                const proceed = window.confirm(
                                    `【警告】クラウドとの自動同期に失敗しました。\n` +
                                    `（理由: ${syncRes ? syncRes.message : '通信エラー'}）\n\n` +
                                    `最新の打刻データが反映されていない可能性があります。\n` +
                                    `ローカルに保存されている古いデータ（キャッシュ）のままExcelを出力しますか？`
                                );
                                if (!proceed) return;
                            }
                        } catch (e) {
                            const proceed = window.confirm(
                                    `【警告】クラウドとの自動同期中にエラーが発生しました。\n` +
                                    `（エラー: ${e.message || '不明なエラー'}）\n\n` +
                                    `最新の打刻データが反映されていない可能性があります。\n` +
                                    `ローカルに保存されている古いデータ（キャッシュ）のままExcelを出力しますか？`
                            );
                            if (!proceed) return;
