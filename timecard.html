        };

        // --- 管理者ダッシュボードコンポーネント ---
        const AdminDashboard = ({ 
            staffList, setStaffList, 
            timeRecords, setTimeRecords, 
            adminPin, setAdminPin,
            gasUrl, setGasUrl,
            syncFromGAS, saveSettingsToGAS, syncStatus,
            openAdminHistoryView, confirmations,
            flushQueue, pendingCount, downloadPendingOps, reportDeviceStatus
        }) => {
            // この端末の名前（「店舗PC」「タブレット」。3.11-5）: 1回だけ付ける
            const [deviceNameInput, setDeviceNameInput] = useState(() => getDeviceName());
            // 知っている端末の一覧（コードレビュー1-8）
            const [knownDevices, setKnownDevices] = useState(null);
            const loadKnownDevices = async () => {
                if (!gasUrl) { setKnownDevices({ error: 'GAS URL が未設定です' }); return; }
                try {
                    const r = await fetch(gasUrl + '?action=deviceStatus&t=' + Date.now(), { method: 'GET', cache: 'no-store' });
                    const ds = await r.json();
                    if (!ds || ds.status !== 'ok' || !Array.isArray(ds.devices)) throw new Error('bad');
                    setKnownDevices({ list: ds.devices.slice().sort((a, b) => Number(a.ageMs) - Number(b.ageMs)) });
                } catch (e) { setKnownDevices({ error: '端末の一覧を取得できませんでした' }); }
            };
            const removeKnownDevice = async (d) => {
                if (!window.confirm(`「${deviceLabel(d)}」を一覧から消しますか？\n（もう使わない端末だけ消してください。使っている端末は、次に開いたときにまた一覧に出ます）`)) return;
                try {
                    const r = await fetch(gasUrl + '?action=removeDevice&id=' + encodeURIComponent(d.id) + '&t=' + Date.now(), { method: 'GET', cache: 'no-store' });
                    const res = await r.json();
                    if (!res || res.status !== 'ok') throw new Error('bad');
                } catch (e) { alert('消せませんでした。通信状態を確かめてください。'); return; }
                loadKnownDevices();
            };
            const [targetMonth, setTargetMonth] = useState(() => {
                const now = new Date(); return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            });
            const [newStaffName, setNewStaffName] = useState('');
            // fileInputRef は不要になりました（テンプレート埋め込み済み）

            const handleAddStaff = () => {
                if (newStaffName && !staffList.find(s => s.name === newStaffName)) {
                    const newList = [...staffList, { name: newStaffName, defaultMeal: false, isOutsourced: false, hourlyRate: 1200, dailyTransport: 0 }];
                    setStaffList(newList);
                    saveSettingsToGAS(newList, adminPin);
                    setNewStaffName('');
                } else if(staffList.find(s => s.name === newStaffName)) {
                    alert('すでに同じ名前のスタッフがいます。');
                }
            };

            const toggleMealSetting = (name) => {
                const newList = staffList.map(s => s.name === name ? { ...s, defaultMeal: !s.defaultMeal } : s);
                setStaffList(newList);
                saveSettingsToGAS(newList, adminPin);
            };
            const toggleOutsourced = (name) => {
                const newList = staffList.map(s => s.name === name ? { ...s, isOutsourced: !s.isOutsourced } : s);
                setStaffList(newList);
                saveSettingsToGAS(newList, adminPin);
            };
            // debounce用タイマーRef（時給・交通費の入力で1文字ごとにGAS送信されるのを防止）
            const settingsSaveTimerRef = useRef(null);
            const debouncedSaveSettingsToGAS = (newList, pin) => {
                if (settingsSaveTimerRef.current) clearTimeout(settingsSaveTimerRef.current);
                settingsSaveTimerRef.current = setTimeout(() => {
                    saveSettingsToGAS(newList, pin);
                }, 500);
            };
            const updateHourlyRate = (name, val) => {
                const newList = staffList.map(s => s.name === name ? { ...s, hourlyRate: parseInt(val) || 0 } : s);
                setStaffList(newList);
                debouncedSaveSettingsToGAS(newList, adminPin);
            };
            const updateDailyTransport = (name, val) => {
                const newList = staffList.map(s => s.name === name ? { ...s, dailyTransport: parseInt(val) || 0 } : s);
                setStaffList(newList);
                debouncedSaveSettingsToGAS(newList, adminPin);
            };
            const handleRemoveStaff = (name) => {
                if (window.confirm(`${name}さんを削除しますか？\n（過去の打刻データは消えませんが、プルダウンに表示されなくなります）`)) {
                    const newList = staffList.filter(s => s.name !== name);
                    setStaffList(newList);
                    saveSettingsToGAS(newList, adminPin);
                }
            };

            // スタッフの表示順を1つ上/下に移動（おなまえプルダウン・スタッフ設定一覧の並び順に反映される）
            const moveStaff = (name, dir) => {
                const index = staffList.findIndex(s => s.name === name);
                const target = index + dir;
                if (index === -1 || target < 0 || target >= staffList.length) return;
                const newList = [...staffList];
                [newList[index], newList[target]] = [newList[target], newList[index]];
                setStaffList(newList);
                saveSettingsToGAS(newList, adminPin);
            };
            
            const handleUpdatePin = () => {
                const newPin = window.prompt("新しい管理者用パスワード（4桁の数字）を入力してください：\n（忘れないようにご注意ください）");
                if (newPin) {
                    if (newPin.length !== 4 || isNaN(newPin)) {
                        alert("パスワードは4桁の半角数字で入力してください。");
                    } else {
                        setAdminPin(newPin);
                        saveSettingsToGAS(staffList, newPin);
                        alert(`パスワードを ${newPin} に変更しました。`);
                    }
                }
            };

            // 見た目がそっくりな異体字（例: はしご高「髙」と標準の「高」）を吸収して有給管理表の名前と照合する。
            // GAS側(gas_backup.gs)の normalizeNameForMatch と同じ変換ルールにしておくこと。
            const KANJI_VARIANTS_JS = [
                ['髙', '高'], ['﨑', '崎'], ['齋', '斎'], ['斉', '斎'], ['邊', '辺'], ['邉', '辺'], ['櫻', '桜'],
            ];
            const normalizeNameForMatch = (name) => {
                let s = String(name || '').trim();
                for (const [from, to] of KANJI_VARIANTS_JS) s = s.split(from).join(to);
                return s;
            };

            // ===== 月次エクセル出力（2026-11-08 改修: 設計書 3.3・3.5-10・3.6-9） =====
            // 1. 未送信を送り切る → 2. 対象月の勤怠（getAll month=）・設定（名簿・本人確認）・有給（対象月末時点）をクラウドから取り直す
            // → 3. 取り直した結果そのものでExcelを作る（手元の値は使わない）。
            // 止める条件（統一）: 勤怠・名簿・本人確認のどれかが取れない、または読めないシートがある → 出力しない（理由を表示）。
            // 有給だけが取れない → 出力は続け、有給欄に「取得できず」と書き、画面でも知らせる。
            // ===== 出力の前準備（通常の出力・外注の出力で共通。3.7-7・3.9-5） =====
            // 1. この端末の未送信を送る → 2. opStatus で全部届いたことを確かめる（届かなければ出力しない）
            // → 3. 対象月・名簿・本人確認（と有給）を取り直す → 出力にはこの結果だけを使う。中止のときは null を返す
            // ExcelJS はファイルから読んだ書式を、同じ書式のセル同士で1つのものとして共有する。そのまま1つのセルの
            // 塗り・文字・罫線・表示形式を変えると、同じ書式の他のセル（別の日の行や見出し）まで変わってしまう
            // （10月の出力で平日まで土曜の水色になっていた原因）。書き込む前に、各セルに自分専用の書式を持たせる。
            const unshareStyles = (ws) => {
                ws.eachRow({ includeEmpty: true }, (row) => {
                    row.eachCell({ includeEmpty: true }, (cell) => { cell.style = JSON.parse(JSON.stringify(cell.style || {})); });
                });
            };
            const writeDeviceWarning = (workbook, warning) => {
                if (!warning || !workbook.worksheets[0]) return;
                const ws = workbook.worksheets[0];
                const cell = ws.getCell('S1');
                cell.value = '⚠ ' + warning;
                cell.font = { bold: true, color: { argb: 'FFFF0000' } };
            };
            const prepareExportData = async (yearStr, monthStr, withLeave) => {
                const ym = `${yearStr}-${monthStr}`;
                // 1. この端末の未送信を送る → 2. opStatus で全部届いたことを確かめる（届かなければ出力しない: 3.7-7）
                if (flushQueue) await flushQueue({ force: true });
                if (flushQueue && loadOpQueue().length > 0) await flushQueue(); // 返事が読めなかった分を opStatus で確かめる
                const pendingAfterFlush = loadOpQueue().length;
                if (pendingAfterFlush > 0) {
                    alert(`⚠️ エクセル出力を中止しました\n\n・この端末に、まだ届いたことを確かめられない未送信が ${pendingAfterFlush}件 あります。\n\n通信状態を確かめて、少し待ってからもう一度押してください。`);
                    return null;
                }

                // 2. 取り直す（並行して実行して待ち時間を短くする）
                const fetchJson = async (url) => {
                    const r = await fetch(url, { method: 'GET', cache: 'no-store' });
                    const ct = r.headers.get('content-type') || '';
                    if (!ct.includes('application/json')) {
                        // GASが一時的にHTMLエラーページを返すことがある（権限・タイムアウト等）
                        throw new Error('GASからJSONが返りませんでした（HTMLエラーページ）');
                    }
                    return r.json();
                };

                // 3. 登録端末（管理画面で名前を付けた店舗PC・タブレット）の未送信を確かめる（3.11-5・3.12-4）:
                // 登録端末すべてについて「最後の知らせが10分以内、かつ その時点で未送信0件」。確かめられない端末があれば
                // 通常は出力を止める。管理者が分かったうえで続けたときは、Excel の先頭シートにその旨を書く（deviceWarning）。
                if (reportDeviceStatus) await reportDeviceStatus(true);
                let deviceWarning = null;
                {
                    let problems = [];
                    let list = '';
                    try {
                        const ds = await fetchJson(gasUrl + '?action=deviceStatus&t=' + Date.now());
                        if (!ds || ds.status !== 'ok' || !Array.isArray(ds.devices)) throw new Error('no device status');
                        // 【コードレビュー1-8】30日以内に知らせのあった端末は、名前が無くてもすべて確かめる（名前の付け忘れで漏れない）
                        const registered = ds.devices.filter(d => d && d.id);
                        if (registered.length === 0) problems.push('知っている端末がありません（管理画面で「この端末の名前」を付けてください）');
                        registered.forEach(d => {
                            const fresh = Number(d.ageMs) <= DEVICE_REPORT_FRESH_MS;
                            if (!fresh) problems.push(`${deviceLabel(d)}: 確認できませんでした（最後の知らせから${formatAge(d.ageMs)}）`);
                            else if (Number(d.pending) > 0) problems.push(`${deviceLabel(d)}: 未送信が${d.pending}件あります`);
                        });
                        list = registered.map(d => `・${deviceLabel(d)}: 未送信 ${d.pending}件（${formatAge(d.ageMs)}前の知らせ）`).join('\n');
                    } catch (e) {
                        problems = ['端末の未送信を確認できませんでした（通信エラー）'];
                    }
                    if (problems.length > 0) {
                        const ok = window.confirm(`⚠️ 出力前の確認: 未送信を確かめられない端末があります。\n\n${problems.join('\n')}\n${list ? '\n' + list + '\n' : ''}\nその端末を開いて、送信されるのを待ってから出力してください。\n（もう使わない端末は、管理画面の「知っている端末」から消せます）\n\n［キャンセル］出力をやめる（おすすめ）\n［OK］分かったうえで出力を続ける（Excel に注意書きが入ります）`);
                        if (!ok) return null;
                        deviceWarning = '出力時に未送信を確認できなかった端末あり: ' + problems.join(' / ');
                    }
                }

                const fetchMonthData = async () => {
                    const url = () => gasUrl + '?action=getAll&month=' + yearStr + monthStr + '&t=' + Date.now();
                    let d = await fetchJson(url());
                    // 読み込み中に書き込みがあった（世代が変わった）ときは1回だけ取り直す
                    if (d && d.status === 'ok' && d.stale) d = await fetchJson(url());
                    return d;
                };
                const fetchLeave = async () => {
                    // 計算中・30秒以内の連続は「少し待ってもう一度」が返るので、少し待って最大3回
                    for (let i = 0; i < 3; i++) {
                        const d = await fetchJson(gasUrl + '?action=getLeaveInfo&month=' + ym + '&t=' + Date.now());
                        if (!d || d.status !== 'busy') return d;
                        await new Promise(ok => setTimeout(ok, i === 0 ? 5000 : 15000));
                    }
                    return { status: 'busy', message: '有給の計算が混み合っています' };
                };
                // 【コードレビュー1-3】GAS への取得は同時に投げず、1件ずつ順番に（勤怠 → 設定 → 有給）
                const settle = async (fn) => { try { return { status: 'fulfilled', value: await fn() }; } catch (e) { return { status: 'rejected', reason: e }; } };
                const monthRes = await settle(fetchMonthData);
                const settingsRes = await settle(() => fetchJson(gasUrl + '?action=getSettings&t=' + Date.now()));

                const stopReasons = [];
                const md = monthRes.status === 'fulfilled' ? monthRes.value : null;
                if (!md || md.status !== 'ok' || !Array.isArray(md.records)) {
                    stopReasons.push('・勤怠データを取得できませんでした' + (monthRes.status === 'rejected' ? `（${monthRes.reason?.message || '通信エラー'}）` : ''));
                } else if (Array.isArray(md.unreadableSheets) && md.unreadableSheets.length > 0) {
                    stopReasons.push('・スプレッドシートに読めないシートがあります: ' + md.unreadableSheets.join('、'));
                }
                const sd = settingsRes.status === 'fulfilled' ? settingsRes.value : null;
                const cloudStaff = sd && sd.status === 'ok' && sd.settings && Array.isArray(sd.settings.staffList) ? sd.settings.staffList : null;
                if (!cloudStaff || cloudStaff.length === 0) {
                    stopReasons.push('・スタッフ名簿・本人確認を取得できませんでした' + (settingsRes.status === 'rejected' ? `（${settingsRes.reason?.message || '通信エラー'}）` : ''));
                } else if (sd.settings.confirmationsOk !== true || !sd.settings.confirmations || typeof sd.settings.confirmations !== 'object') {
                    // 【コードレビュー1-2】本人確認が読めないときは全員「未」で出さずに止める（3.3-1）
                    stopReasons.push('・本人確認（確認済みの印）を取得できませんでした' + (sd.settings.confirmationsError ? `（${sd.settings.confirmationsError}）` : ''));
                }
                if (stopReasons.length > 0) {
                    alert('⚠️ エクセル出力を中止しました\n\n' + stopReasons.join('\n') + '\n\n通信状態を確かめて、もう一度押してください。');
                    return null;
                }
                // 有給は最後に（勤怠・設定が取れたときだけ）。有給だけ取れないときは出力を続け「取得できず」（3.3-1）
                const leaveRes = await settle(() => withLeave ? fetchLeave() : Promise.resolve(null));

                // 出力に使うのは取り直した結果だけ（3.5-10）
                const exportStaff = cloudStaff
                    .filter(s => (typeof s === 'string' && s.trim()) || (s && typeof s.name === 'string' && s.name.trim()))
                    .map(s => typeof s === 'string' ? { name: s, isOutsourced: false } : s);
                const exportConfirmations = sd.settings.confirmations;
                const exportRecords = md.records.filter(r => r && typeof r.id === 'string' && !r.deleted && String(r.date || '').startsWith(ym));
                const recordById = {};
                exportRecords.forEach(r => { recordById[r.id] = r; });
                return { staff: exportStaff, confirmations: exportConfirmations, records: exportRecords, recordById, leaveRes, deviceWarning };
            };

            const handleExportWithTemplate = async () => {
                try {
                    const [yearStr, monthStr] = targetMonth.split('-');
                    const year = parseInt(yearStr);
                    const month = parseInt(monthStr);
                    const ym = `${yearStr}-${monthStr}`;
                    const daysInMonth = new Date(year, month, 0).getDate();
                    if (!gasUrl) { alert('⚠️ GAS URL が未設定のため出力できません。'); return; }

                    const prep = await prepareExportData(yearStr, monthStr, true);
                    if (!prep) return;
                    const { staff: exportStaff, confirmations: exportConfirmations, records: exportRecords, recordById, leaveRes } = prep;

                    // 有給（対象月末時点）
                    let leaveInfo = {};
                    let leaveOk = false;
                    let leaveBaseDate = `${year}/${month}/${daysInMonth}`;
                    let leaveFailReason = '';
                    const lv = leaveRes.status === 'fulfilled' ? leaveRes.value : null;
                    // 月末時点の値には基準日（baseDate）が付く。付いていない返事（GAS 更新前の古い GAS は「今日」時点の値）は使わない
                    if (lv && lv.status === 'ok' && lv.found && lv.leaveInfo && lv.baseDate) {
                        leaveInfo = lv.leaveInfo; leaveOk = true;
                        leaveBaseDate = lv.baseDate;
                    } else if (lv && lv.status === 'ok' && lv.found && !lv.baseDate) {
                        leaveFailReason = 'GAS が古いため月末時点の値を取得できません';
                    } else {
                        leaveFailReason = leaveRes.status === 'rejected' ? (leaveRes.reason?.message || '通信エラー') : ((lv && (lv.reason || lv.message)) || '不明');
                    }

                    const workbook = new ExcelJS.Workbook();

                    // Base64テンプレートをデコードしてバッファに変換
                    const b64 = EXCEL_TEMPLATE_B64;
                    const binaryStr = atob(b64);
                    const bytes = new Uint8Array(binaryStr.length);
                    for (let i = 0; i < binaryStr.length; i++) {
                        bytes[i] = binaryStr.charCodeAt(i);
                    }
                    const buffer = bytes.buffer;
                    await workbook.xlsx.load(buffer);

                    const timeToExcelFraction = (timeStr) => {
                        if (!timeStr) return null;
                        const parts = timeStr.split(':');
                        const h = parseInt(parts[0], 10) || 0;
                        const m = parseInt(parts[1], 10) || 0;
                        const s = parseInt(parts[2], 10) || 0;
                        return (h * 3600 + m * 60 + s) / 86400;
                    };

                    // ===== シートレイアウト完全統一ヘルパー =====
                    // 新規メンバーが何人増えても、草野久美子等の初期メンバーと同一のレイアウトに自動統一
                    const normalizeSheetLayout = (targetWs, sRow) => {
                        // 1. 列幅の完全統一（A列〜Q列）
                        const STANDARD_COL_WIDTHS = [
                            11.2, // A: 日付
                            5.2,  // B: 曜日
                            6.0,  // C: 出勤
                            13.0, // D: 中抜
                            13.0, // E: 中抜
                            6.0,  // F: 退勤
                            9.2,  // G: 賄い
                            5.2,  // H
                            3.1,  // I
                            13.0, // J
                            7.1,  // K: 休憩
                            13.0, // L: 勤務時間
                            9.0,  // M
                            13.0, // N
                            4.6,  // O
                            12.5, // P: 交通費
                            13.0  // Q: 備考
                        ];
                        STANDARD_COL_WIDTHS.forEach((w, idx) => {
                            const col = targetWs.getColumn(idx + 1);
                            col.width = w;
                        });

                        // 2. 行の高さの完全統一（ヘッダー・日付行は18.75pt、集計行は18.6pt）
                        for (let r = 1; r <= sRow + 30; r++) {
                            targetWs.getRow(r).height = 18.75;
                        }
                        for (let r = sRow + 31; r <= sRow + 34; r++) {
                            targetWs.getRow(r).height = 18.6;
                        }

                        // 3. ヘッダー行の確認・補完（P列: 交通費, Q列: 備考）
                        try {
                            const headerRow = targetWs.getRow(sRow - 1);
                            if (!headerRow.getCell(16).value) headerRow.getCell(16).value = '交通費';
                            if (!headerRow.getCell(17).value) headerRow.getCell(17).value = '備考';
                        } catch (e) {}

                        // 4. 土日・日付曜日カラー統一（草野久美子等の初期シートと完全一致）
                        for (let d = 1; d <= 31; d++) {
                            const r = targetWs.getRow(sRow + d - 1);
                            const cellA = r.getCell(1);
                            const cellB = r.getCell(2);
                            if (d <= daysInMonth) {
                                const targetDateObj = new Date(year, month - 1, d);
                                const dayOfWeek = targetDateObj.getDay(); // 0: 日, 6: 土
                                const fontA = { ...(cellA.font || { name: 'Yu Gothic', size: 11 }) };
                                const fontB = { ...(cellB.font || { name: 'Yu Gothic', size: 11 }) };

                                if (dayOfWeek === 6) {
                                    // 土曜日: 水色背景 (#DDEBF7), 青文字 (#5B9BD5)
                                    const satFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFDDEBF7' } };
                                    cellA.fill = satFill;
                                    cellB.fill = satFill;
                                    fontA.color = { argb: 'FF5B9BD5' };
                                    fontB.color = { argb: 'FF5B9BD5' };
                                    cellA.font = fontA;
                                    cellB.font = fontB;
                                } else if (dayOfWeek === 0) {
                                    // 日曜日: 薄赤/サーモン背景 (#FCE4D6), 赤文字 (#FF0000)
                                    const sunFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFCE4D6' } };
                                    cellA.fill = sunFill;
                                    cellB.fill = sunFill;
                                    fontA.color = { argb: 'FFFF0000' };
                                    fontB.color = { argb: 'FFFF0000' };
                                    cellA.font = fontA;
                                    cellB.font = fontB;
                                } else {
                                    // 平日: 塗りつぶしなし, 通常黒文字
                                    cellA.fill = null;
                                    cellB.fill = null;
                                    fontA.color = { argb: 'FF000000' };
                                    fontB.color = { argb: 'FF000000' };
                                    cellA.font = fontA;
                                    cellB.font = fontB;
                                }
                            } else {
                                // 月末以降（29〜31日の余白）
                                cellA.fill = null;
                                cellB.fill = null;
                            }
                        }
                    };

                    // ステップ1: マスタ（＝草野久美子シートと同じ形のテンプレート）の日付・曜日を対象月に書き換え、書式を整える
                    const masterWs = workbook.getWorksheet('マスタ');
                    if (!masterWs) throw new Error('テンプレートに「マスタ」シートがありません');
                    unshareStyles(masterWs); // 複製したシートもセルごとに別の書式になる
                    const startRow = 2; // 1行目が見出し、2行目から1日〜31日
                    for (let d = 1; d <= 31; d++) {
                        const row = masterWs.getRow(startRow + d - 1);
                        // 全書き込み対象セルをクリア
                        [1,2,3,4,5,6,7,11,16,17].forEach(c => { row.getCell(c).value = null; });
                        if (d <= daysInMonth) {
                            const targetDateObj = new Date(year, month - 1, d);
                            const dateVal = new Date(Date.UTC(year, month - 1, d, 12, 0, 0));
                            row.getCell(1).value = dateVal;
                            row.getCell(1).numFmt = 'yyyy/m/d';
                            row.getCell(2).value = ['日', '月', '火', '水', '木', '金', '土'][targetDateObj.getDay()];
                        }
                    }
                    normalizeSheetLayout(masterWs, startRow);

                    // マスタを丸ごと複製して新しいシートを作る（ExcelJSに公式の複製は無いため、シートの設計図 model を写して名前だけ変える）
                    const cloneModel = (m) => (typeof structuredClone === 'function') ? structuredClone(m) : JSON.parse(JSON.stringify(m));
                    const cloneMasterAs = (name) => {
                        const ws = workbook.addWorksheet(name);
                        const model = cloneModel(masterWs.model);
                        model.name = name;
                        model.id = ws.id;
                        model.mergeCells = model.merges;
                        ws.model = model;
                        return ws;
                    };

                    const thin = { style: 'thin', color: { argb: 'FF000000' } };
                    const boxBorder = { top: thin, left: thin, bottom: thin, right: thin };
                    const normalFont = { bold: false, color: { argb: 'FF000000' }, size: 11, name: 'Yu Gothic' };
                    const ymKey = `${year}-${String(month).padStart(2, '0')}`;

                    // ステップ2: 対象月に出勤記録があるスタッフ（外注を除く）だけ、マスタから複製して勤怠データを書き込む
                    // （出勤記録の無いスタッフのシートは出さない。外注用の出力は別ボタン）
                    const onlineWarnings = [];
                    exportStaff.filter(s => !s.isOutsourced).forEach(staff => {
                        const hasRecord = exportRecords.some(r => r.staffName === staff.name);
                        if (!hasRecord) return;
                        if (workbook.getWorksheet(staff.name)) return; // 同じ名前の重複登録
                        const ws = cloneMasterAs(staff.name);

                        for (let d = 1; d <= daysInMonth; d++) {
                            const row = ws.getRow(startRow + d - 1);
                            const targetDateStrShort = `${ymKey}-${String(d).padStart(2, '0')}`;
                            const record = recordById[`${staff.name}_${targetDateStrShort}`];

                            if (record) {
                                if (record.isPaidLeave) {
                                    row.getCell(17).value = ('【有給申請】 ' + cleanRemarksForExcel(record.remarks)).trim();
                                } else {
                                    row.getCell(3).value = timeToExcelFraction(record.clockIn);
                                    row.getCell(6).value = timeToExcelFraction(record.clockOut);
                                    row.getCell(7).value = record.meal ? 1 : null;

                                    let remarks = record.remarks || '';
                                    // 中抜け欄は実際の打刻データのみ記入
                                    row.getCell(4).value = timeToExcelFraction(record.breakStart);
                                    row.getCell(5).value = timeToExcelFraction(record.breakEnd);

                                    row.getCell(16).value = (record.transport !== undefined && record.transport !== null) ? Number(record.transport) : null;
                                    row.getCell(17).value = cleanRemarksForExcel(remarks) || null;

                                    // K列(col11)に合計休憩時間を書き込む
                                    if (record.clockIn && record.clockOut) {
                                        const addMins = parseInt(record.additionalBreakMins) || 0;
                                        let middleBreakMins = 0;
                                        if (record.breakStart && record.breakEnd) {
                                            const bsF = timeToExcelFraction(record.breakStart);
                                            const beF = timeToExcelFraction(record.breakEnd);
                                            if (bsF !== null && beF !== null) {
                                                middleBreakMins = Math.round((beF - bsF) * 24 * 60);
                                            }
                                        }
                                        let totalBreakMins = middleBreakMins + addMins;
                                        // 旧データ対応: additionalBreakMinsフィールドが存在しない(undefined/null)かつ中抜けなしの場合のみ6時間ルールを適用
                                        // additionalBreakMinsが明示的に0の場合はユーザーが入力した値なのでそのまま
                                        if (totalBreakMins === 0 && (record.additionalBreakMins === undefined || record.additionalBreakMins === null)) {
                                            const ciF = timeToExcelFraction(record.clockIn);
                                            const coF = timeToExcelFraction(record.clockOut);
                                            if (ciF !== null && coF !== null) {
                                                let workFrac = coF - ciF;
                                                if (workFrac < 0) workFrac += 1;
                                                if (workFrac >= 6 / 24) totalBreakMins = 45;
                                            }
                                        }
                                        if (totalBreakMins >= 0) {
                                            row.getCell(11).value = totalBreakMins / 60 / 24;
                                            row.getCell(11).numFmt = 'h:mm';
                                        }
                                    }
                                }
                            }
                        }

                        // ===== 交通費 月間合計（SUM関数）＋本人確認日時 =====
                        // 税理士様式は P33「交通費」見出し・P34「=SUM(P2:P32)」を既に内蔵しているため、
                        // 無ければ補完するだけに留め、既存の書式（太字・色）は変更しない。
                        try {
                            const labelRow = ws.getRow(startRow + 31);   // 見出し行（33行目）
                            if (!labelRow.getCell(16).value) labelRow.getCell(16).value = '交通費';
                            const sumRow = ws.getRow(startRow + 32);     // 合計値行（34行目）
                            if (!sumRow.getCell(16).value) {
                                sumRow.getCell(16).value = { formula: `SUM(P${startRow}:P${startRow + 30})` };
                                sumRow.getCell(16).numFmt = '#,##0"円"';
                            }
                            const confAt = exportConfirmations[`${staff.name}|${ymKey}`] || null;
                            const confRow = ws.getRow(startRow + 34);    // 1行空けた36行目相当
                            confRow.getCell(16).value = confAt ? `本人確認済み: ${confAt}` : '本人確認: 未';
                        } catch (e) { console.warn('交通費合計の書き込みに失敗', e); }

                        // ===== 有給休暇（A33〜E34・全員同じ位置） =====
                        // 「今月の消化日数」は取り直した勤怠データから、「残日数・次回付与日」は
                        // 有給管理簿を対象月の末日時点で計算し直した値（GAS getLeaveInfo&month=）。
                        try {
                            const leaveRow33 = ws.getRow(startRow + 31); // 33行目相当
                            const leaveRow34 = ws.getRow(startRow + 32); // 34行目相当
                            const setNormalCell = (row, col, val) => {
                                const c = row.getCell(col);
                                c.value = val;
                                c.font = normalFont;
                            };
                            setNormalCell(leaveRow33, 1, '有休消化');
                            setNormalCell(leaveRow33, 3, '残有休日数');
                            setNormalCell(leaveRow34, 3, '次回発生');

                            const usedThisMonth = exportRecords.filter(r => r.staffName === staff.name && r.isPaidLeave).length;
                            setNormalCell(leaveRow33, 2, usedThisMonth);

                            if (!leaveOk) {
                                setNormalCell(leaveRow33, 5, '取得できず');
                                setNormalCell(leaveRow34, 5, '');
                            } else {
                                const info = leaveInfo[normalizeNameForMatch(staff.name)];
                                if (info) {
                                    setNormalCell(leaveRow33, 5, (info.remainingDays !== undefined && info.remainingDays !== null && info.remainingDays !== '')
                                        ? `${info.remainingDays}日` : '');
                                    setNormalCell(leaveRow34, 5, info.nextGrantDate
                                        ? String(info.nextGrantDate).replace(/\//g, '.').replace(/\.0(\d)/g, '.$1')
                                        : '');
                                } else {
                                    setNormalCell(leaveRow33, 5, '未登録');
                                    setNormalCell(leaveRow34, 5, '');
                                }
                            }
                            // 基準日（3.3-1）: 有給欄のすぐ下（A35）
                            setNormalCell(ws.getRow(startRow + 33), 1, leaveOk ? `有給は ${leaveBaseDate} 時点` : '有給は取得できず');
                        } catch (e) { console.warn('有給欄の書き込みに失敗', e); }

                        // ===== オンライン業務欄（3.3-3・chihiro指示 2026-11-08） =====
                        // 対象月の備考に「オンライン」を含む日があるスタッフだけ。A36 見出し、37行目から1件1行
                        // （C=日付 m/d、D=備考の文言、E=金額）、最後の行の次に「合計」。件数に上限なし。A〜E列だけ使う。
                        try {
                            const onlineRecs = exportRecords
                                .filter(r => r.staffName === staff.name && typeof r.remarks === 'string' && r.remarks.includes('オンライン'))
                                .sort((a, b) => a.date.localeCompare(b.date));
                            if (onlineRecs.length > 0) {
                                const top = startRow + 34; // 36行目
                                const setBoxCell = (r, c, v, fmt) => {
                                    const cell = ws.getRow(r).getCell(c);
                                    cell.value = v;
                                    cell.font = normalFont;
                                    cell.border = boxBorder;
                                    if (fmt) cell.numFmt = fmt;
                                };
                                for (let c = 1; c <= 5; c++) setBoxCell(top, c, null);
                                setBoxCell(top, 1, 'オンライン業務');
                                onlineRecs.forEach((r, i) => {
                                    const rowNo = top + 1 + i;
                                    const text = cleanRemarksForExcel(r.remarks);
                                    const amount = parseOnlineAmount(text);
                                    const [, mm, dd] = r.date.split('-');
                                    setBoxCell(rowNo, 1, amount === null ? '金額要確認' : null);
                                    setBoxCell(rowNo, 2, null);
                                    setBoxCell(rowNo, 3, `${parseInt(mm)}/${parseInt(dd)}`);
                                    setBoxCell(rowNo, 4, text);
                                    setBoxCell(rowNo, 5, amount, '#,##0"円"');
                                    if (amount === null) onlineWarnings.push(`${staff.name} ${r.date}`);
                                });
                                const totalRow = top + 1 + onlineRecs.length;
                                for (let c = 1; c <= 5; c++) setBoxCell(totalRow, c, null);
                                setBoxCell(totalRow, 3, '合計');
                                setBoxCell(totalRow, 5, { formula: `SUM(E${top + 1}:E${totalRow - 1})` }, '#,##0"円"');
                            }
                        } catch (e) { console.warn('オンライン業務欄の書き込みに失敗', e); }
                    });

                    // 未送信を確認できなかった端末があるまま出力したときは、先頭シートに注意書き（3.12-4）
                    writeDeviceWarning(workbook, prep.deviceWarning);
                    const outBuffer = await workbook.xlsx.writeBuffer();
                    const blob = new Blob([outBuffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
                    
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = `タイムカード入力_${year}${String(month).padStart(2, '0')}給与分_アプリ出力.xlsx`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    const notes = [];
                    if (!leaveOk) notes.push(`⚠️ 有給の残日数・次回付与日を取得できませんでした（有給欄に「取得できず」と書きました）\n（理由: ${leaveFailReason}）`);
                    if (onlineWarnings.length > 0) notes.push(`⚠️ オンライン業務の金額を備考から読み取れなかった日があります（「金額要確認」と書きました）:\n${onlineWarnings.join('\n')}`);
                    alert('出力に成功しました！' + (notes.length ? '\n\n' + notes.join('\n\n') : ''));
                } catch (error) {
                    console.error(error);
                    alert("出力中にエラーが発生しました。\n" + (error && error.message ? error.message : ''));
                }
            };

            // ===== 外注者専用エクセル出力（給与計算付き）=====
            const handleExportOutsourced = async () => {
                try {
                    // 【2026-11-08 3.9-5】通常の出力と同じく「未送信を送る→届いたことを確かめる→対象月を取り直す→その結果だけで作る」。
                    // （端末に残っている記録は直近2か月だけなので、手元の記録で作ると古い月の金額が狂う）
                    if (!gasUrl) { alert('⚠️ GAS URL が未設定のため出力できません。'); return; }
                    const [prepYear, prepMonth] = targetMonth.split('-');
                    const prep = await prepareExportData(prepYear, prepMonth, false);
                    if (!prep) return;
                    const recordById = prep.recordById;

                    const outsourcedStaff = prep.staff.filter(s => s.isOutsourced);
                    if (outsourcedStaff.length === 0) {
                        alert('外注者が設定されていません。スタッフ設定で「外注者」をONにしてください。');
                        return;
                    }

                    const [yearStr, monthStr] = targetMonth.split('-');
                    const year = parseInt(yearStr);
                    const month = parseInt(monthStr);
                    const daysInMonth = new Date(year, month, 0).getDate();

                    // ===== 通常テンプレートと同じ処理でロード =====
                    const timeToExcelFraction = (timeStr) => {
                        if (!timeStr) return null;
                        const parts = timeStr.split(':');
                        const h = parseInt(parts[0], 10) || 0;
                        const m = parseInt(parts[1], 10) || 0;
                        const s = parseInt(parts[2], 10) || 0;
                        return (h * 3600 + m * 60 + s) / 86400;
                    };

                    // ===== シートレイアウト完全統一ヘルパー =====
                    // 新規メンバーが何人増えても、草野久美子等の初期メンバーと同一のレイアウトに自動統一
                    const normalizeSheetLayout = (targetWs, sRow) => {
                        // 1. 列幅の完全統一（A列〜Q列）
                        const STANDARD_COL_WIDTHS = [
                            11.2, // A: 日付
                            5.2,  // B: 曜日
                            6.0,  // C: 出勤
                            13.0, // D: 中抜
                            13.0, // E: 中抜
                            6.0,  // F: 退勤
                            9.2,  // G: 賄い
                            5.2,  // H
                            3.1,  // I
                            13.0, // J
                            7.1,  // K: 休憩
                            13.0, // L: 勤務時間
                            9.0,  // M
                            13.0, // N
                            4.6,  // O
                            12.5, // P: 交通費
                            13.0  // Q: 備考
                        ];
                        STANDARD_COL_WIDTHS.forEach((w, idx) => {
                            const col = targetWs.getColumn(idx + 1);
                            col.width = w;
                        });

                        // 2. 行の高さの完全統一（ヘッダー・日付行は18.75pt、集計行は18.6pt）
                        for (let r = 1; r <= sRow + 30; r++) {
                            targetWs.getRow(r).height = 18.75;
                        }
                        for (let r = sRow + 31; r <= sRow + 34; r++) {
                            targetWs.getRow(r).height = 18.6;
                        }

                        // 3. ヘッダー行の確認・補完（P列: 交通費, Q列: 備考）
                        try {
                            const headerRow = targetWs.getRow(sRow - 1);
                            if (!headerRow.getCell(16).value) headerRow.getCell(16).value = '交通費';
                            if (!headerRow.getCell(17).value) headerRow.getCell(17).value = '備考';
                        } catch (e) {}

                        // 4. 土日・日付曜日カラー統一（草野久美子等の初期シートと完全一致）
                        for (let d = 1; d <= 31; d++) {
                            const r = targetWs.getRow(sRow + d - 1);
                            const cellA = r.getCell(1);
                            const cellB = r.getCell(2);
                            if (d <= daysInMonth) {
                                const targetDateObj = new Date(year, month - 1, d);
                                const dayOfWeek = targetDateObj.getDay(); // 0: 日, 6: 土
                                const fontA = { ...(cellA.font || { name: 'Yu Gothic', size: 11 }) };
                                const fontB = { ...(cellB.font || { name: 'Yu Gothic', size: 11 }) };

                                if (dayOfWeek === 6) {
                                    // 土曜日: 水色背景 (#DDEBF7), 青文字 (#5B9BD5)
                                    const satFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFDDEBF7' } };
                                    cellA.fill = satFill;
                                    cellB.fill = satFill;
                                    fontA.color = { argb: 'FF5B9BD5' };
                                    fontB.color = { argb: 'FF5B9BD5' };
                                    cellA.font = fontA;
                                    cellB.font = fontB;
                                } else if (dayOfWeek === 0) {
                                    // 日曜日: 薄赤/サーモン背景 (#FCE4D6), 赤文字 (#FF0000)
                                    const sunFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFCE4D6' } };
                                    cellA.fill = sunFill;
                                    cellB.fill = sunFill;
                                    fontA.color = { argb: 'FFFF0000' };
                                    fontB.color = { argb: 'FFFF0000' };
                                    cellA.font = fontA;
                                    cellB.font = fontB;
                                } else {
                                    // 平日: 塗りつぶしなし, 通常黒文字
                                    cellA.fill = null;
                                    cellB.fill = null;
                                    fontA.color = { argb: 'FF000000' };
                                    fontB.color = { argb: 'FF000000' };
                                    cellA.font = fontA;
                                    cellB.font = fontB;
                                }
                            } else {
                                // 月末以降（29〜31日の余白）
                                cellA.fill = null;
                                cellB.fill = null;
                            }
                        }
                    };

                    const workbook = new ExcelJS.Workbook();
                    const b64 = EXCEL_TEMPLATE_B64;
                    const binaryStr = atob(b64);
                    const bytes = new Uint8Array(binaryStr.length);
                    for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);
                    await workbook.xlsx.load(bytes.buffer);
                    workbook.eachSheet((ws) => unshareStyles(ws));

                    // ステップ1: 全シートの日付・曜日を対象月に更新（通常出力と同じ）
                    const findStartRow = (ws) => {
                        let startRow = -1;
                        ws.eachRow((row, rowNumber) => {
                            if (startRow !== -1) return;
                            let isHeader = false;
                            row.eachCell((cell) => {
                                const v = cell.value;
                                if (typeof v === 'string' && (v.includes('出勤') || v.includes('曜日') || v.includes('退勤'))) isHeader = true;
                            });
                            if (isHeader) startRow = rowNumber + 1;
                        });
                        if (startRow === -1) {
                            ws.eachRow((row, rowNumber) => {
                                if (startRow !== -1) return;
                                const cellA = row.getCell(1).value;
                                if (cellA instanceof Date || (typeof cellA === 'number' && cellA > 40000)) startRow = rowNumber;
                            });
                        }
                        return startRow;
                    };

                    workbook.eachSheet((ws) => {
                        const startRow = findStartRow(ws);
                        if (startRow === -1) return;
                        for (let d = 1; d <= 31; d++) {
                            const row = ws.getRow(startRow + d - 1);
                            [1,2,3,4,5,6,7,11,16,17].forEach(c => { row.getCell(c).value = null; });
                            if (d <= daysInMonth) {
                                const targetDateObj = new Date(year, month - 1, d);
                                const dateVal = new Date(Date.UTC(year, month - 1, d, 12, 0, 0));
                                row.getCell(1).value = dateVal;
                                row.getCell(1).numFmt = 'yyyy/m/d';
                                row.getCell(2).value = ['日','月','火','水','木','金','土'][targetDateObj.getDay()];
                            }
                        }
                        normalizeSheetLayout(ws, startRow);
                    });

                    // ステップ2: 外注者のデータを書き込み（賄いは書かない）
                    const outsourcedPayData = {};
                    outsourcedStaff.forEach(staff => {
                        let ws = workbook.getWorksheet(staff.name);

                        // ===== 完全一致のシートがない場合のハイブリッド対応 =====
                        if (!ws) {
                            let fallbackWs = null;
                            workbook.eachSheet((sheet) => {
                                if (sheet.name !== 'マスタ' && sheet.name.length > 0 && staff.name.includes(sheet.name)) {
                                    if (!fallbackWs) fallbackWs = sheet;
                                }
                            });
                            if (fallbackWs) {
                                fallbackWs.name = staff.name; // 旧シートをフルネームにリネーム
                                ws = fallbackWs;
                            }
                        }

                        if (!ws) {
                            const masterWs = workbook.getWorksheet('マスタ');
                            if (masterWs) {
                                ws = workbook.addWorksheet(staff.name);
                                masterWs.columns.forEach((col, index) => {
                                    const newCol = ws.getColumn(index + 1);
                                    if (col.width) newCol.width = col.width;
                                    if (col.style) newCol.style = col.style;
                                });
                                masterWs.eachRow({ includeEmpty: true }, (row, rowNumber) => {
                                    const newRow = ws.getRow(rowNumber);
                                    if (row.height) newRow.height = row.height;
                                    row.eachCell({ includeEmpty: true }, (cell, colNumber) => {
                                        const newCell = newRow.getCell(colNumber);
                                        newCell.value = cell.value;
                                        newCell.style = JSON.parse(JSON.stringify(cell.style || {}));
                                    });
                                });
                                if (masterWs.model.merges) {
                                    masterWs.model.merges.forEach(merge => ws.mergeCells(merge));
                                }

                                let sRow = findStartRow(ws);
                                if (sRow === -1) sRow = 2;

                                for (let d = 1; d <= 31; d++) {
                                    const r = ws.getRow(sRow + d - 1);
                                    [1,2,3,4,5,6,7,11,16,17].forEach(c => { r.getCell(c).value = null; });
                                    if (d <= daysInMonth) {
                                        const tDateObj = new Date(year, month - 1, d);
                                        const dVal = new Date(Date.UTC(year, month - 1, d, 12, 0, 0));
                                        r.getCell(1).value = dVal;
                                        r.getCell(1).numFmt = 'yyyy/m/d';
                                        r.getCell(2).value = ['日','月','火','水','木','金','土'][tDateObj.getDay()];
                                    }
                                }
                                normalizeSheetLayout(ws, sRow);
                            }
                        }

                        if (!ws) {
                            console.warn(`テンプレート内に「マスタ」がないため、${staff.name} さんのシートを生成できません。`);
                            return;
                        }

                        const startRow = findStartRow(ws);
                        if (startRow === -1) return;

                        let totalDays = 0, totalCalcFrac = 0;

                        for (let d = 1; d <= daysInMonth; d++) {
                            const row = ws.getRow(startRow + d - 1);
                            const dateStrShort = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                            const record = recordById[`${staff.name}_${dateStrShort}`];
                            if (!record) continue;

                            if (record.isPaidLeave) {
                                row.getCell(17).value = ('【有給申請】 ' + cleanRemarksForExcel(record.remarks)).trim();
                            } else {
                                row.getCell(3).value = timeToExcelFraction(record.clockIn);
                                row.getCell(6).value = timeToExcelFraction(record.clockOut);
                                // 賄い（col 7）は外注者なので書かない

                                let remarks = record.remarks || '';
                                // 中抜け欄は実際の打刻データのみ記入
                                row.getCell(4).value = timeToExcelFraction(record.breakStart);
                                row.getCell(5).value = timeToExcelFraction(record.breakEnd);

                                row.getCell(16).value = (record.transport !== undefined && record.transport !== null) ? Number(record.transport) : null;
                                row.getCell(17).value = cleanRemarksForExcel(remarks) || null;

                                // K列(col11)に合計休憩時間を書き込む
                                if (record.clockIn && record.clockOut) {
                                    const addMins = parseInt(record.additionalBreakMins) || 0;
                                    let middleBreakMins = 0;
                                    if (record.breakStart && record.breakEnd) {
                                        const bsF = timeToExcelFraction(record.breakStart);
                                        const beF = timeToExcelFraction(record.breakEnd);
                                        if (bsF !== null && beF !== null) {
                                            middleBreakMins = Math.round((beF - bsF) * 24 * 60);
                                        }
                                    }
                                    let totalBreakMins = middleBreakMins + addMins;
                                    // 旧データ対応: additionalBreakMinsフィールドが存在しない(undefined/null)かつ中抜けなしの場合のみ6時間ルールを適用
                                    // additionalBreakMinsが明示的に0の場合はユーザーが入力した値なのでそのまま
                                    if (totalBreakMins === 0 && (record.additionalBreakMins === undefined || record.additionalBreakMins === null)) {
                                        const ciF = timeToExcelFraction(record.clockIn);
                                        const coF = timeToExcelFraction(record.clockOut);
                                        if (ciF !== null && coF !== null) {
                                            let workFrac = coF - ciF;
                                            if (workFrac < 0) workFrac += 1;
                                            if (workFrac >= 6 / 24) totalBreakMins = 45;
                                        }
                                    }
                                    if (totalBreakMins >= 0) {
                                        row.getCell(11).value = totalBreakMins / 60 / 24;
                                        row.getCell(11).numFmt = 'h:mm';
                                    }

                                    const ci = timeToExcelFraction(record.clockIn);
                                    const co = timeToExcelFraction(record.clockOut);
                                    const bs = timeToExcelFraction(record.breakStart);
                                    const be = timeToExcelFraction(record.breakEnd);
                                    let workFrac = co - ci;
                                    if (workFrac < 0) workFrac += 1;
                                    if (bs && be) workFrac -= (be - bs);
                                    const breakDeduct = totalBreakMins > 0 ? (totalBreakMins / 1440) : 0;
                                    totalCalcFrac += Math.max(0, workFrac - breakDeduct);
                                    totalDays++;
                                }
                            }
                        }

                        // 給与計算ブロックをデータ行の下に追加
                        const hourlyRate = staff.hourlyRate || 1200;
                        const dailyTransport = staff.dailyTransport || 0;
                        const totalH = Math.round(totalCalcFrac * 24 * 100) / 100;
                        const remuneration = Math.round(totalH * hourlyRate);
                        const transportTotal = dailyTransport * totalDays;
                        const totalBill = remuneration + transportTotal;
                        const moneyFmt = '#,##0"円"';
                        const blockStart = startRow + 33; // データ31行＋バッファ

                        const labelFont = { bold: true };
                        const bgPay = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFF3E0' } };
                        const bgBill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFCE4EC' } };

                        const setPayRow = (offset, label, value, fmt, note, isBig) => {
                            const r = ws.getRow(blockStart + offset);
                            r.getCell(3).value = label; r.getCell(3).font = labelFont; r.getCell(3).fill = bgPay;
                            r.getCell(4).value = value;
                            if (fmt) r.getCell(4).numFmt = fmt;
                            if (isBig) r.getCell(4).font = { bold: true, size: 12 };
                            r.getCell(4).fill = isBig ? bgBill : bgPay;
                            if (note) { r.getCell(5).value = note; r.getCell(5).fill = bgPay; }
                        };

                        ws.getRow(blockStart).getCell(3).value = '【給与計算】';
                        ws.getRow(blockStart).getCell(3).font = { bold: true, size: 11 };
                        // すべてセル参照の数式にする: タイムカード側の数字を直せば報酬・請求まで自動で再計算される
                        setPayRow(1, '勤務時間合計', { formula: `ROUND(SUM(L${startRow}:L${startRow + 30})*24,2)` }, '0.00"時間"', `(${totalDays}日出勤)`, false);
                        setPayRow(2, '時給', hourlyRate, moneyFmt, null, false);
                        setPayRow(3, '1日交通費（参考）', dailyTransport, moneyFmt, '実際はP列の日別入力が優先', false);
                        setPayRow(4, '報酬', { formula: `ROUND(D${blockStart + 1}*D${blockStart + 2},0)` }, moneyFmt, '勤務時間合計 × 時給', false);
                        setPayRow(5, '交通費合計', { formula: `SUM(P${startRow}:P${startRow + 30})` }, moneyFmt, 'P列（日別交通費）の合計', false);
                        setPayRow(6, '請求合計', { formula: `D${blockStart + 4}+D${blockStart + 5}` }, moneyFmt, '報酬 ＋ 交通費合計', true);

                        // レイアウト・書式・土日カラーを全スタッフのシートに統一適用（草野久美子等の初期シートと同一）
                        normalizeSheetLayout(ws, startRow);

                        outsourcedPayData[staff.name] = true;
                    });

                    // ステップ3: 外注者以外のシートを削除
                    const outsourcedNames = new Set(outsourcedStaff.map(s => s.name));
                    const sheetsToRemove = [];
                    workbook.eachSheet((ws) => {
                        if (ws.name === 'マスタ') return;
                        if (!outsourcedNames.has(ws.name)) {
                            sheetsToRemove.push(ws.name);
                            return;
                        }
                        // 外注者でもデータがなければ削除
                        if (!outsourcedPayData[ws.name]) sheetsToRemove.push(ws.name);
                    });
                    sheetsToRemove.forEach(name => {
                        const ws = workbook.getWorksheet(name);
                        if (ws) workbook.removeWorksheet(ws.id);
                    });

                    if (workbook.worksheets.length === 0) {
                        alert('外注者のシートがテンプレート内に見つかりませんでした。\nスタッフ名がテンプレートのシート名と完全一致しているか確認してください。');
                        return;
                    }

                    // 未送信を確認できなかった端末があるまま出力したときは、先頭シートに注意書き（3.12-4）
                    writeDeviceWarning(workbook, prep.deviceWarning);
                    const outBuffer = await workbook.xlsx.writeBuffer();
                    const blob = new Blob([outBuffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = `外注タイムカード_${year}${String(month).padStart(2,'0')}給与分.xlsx`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    alert('外注者エクセルを出力しました！');
                } catch (error) {
                    console.error(error);
                    alert('外注者エクセルの出力中にエラーが発生しました。\n' + error.message);
                }
            };

            return (
                <div className="animate-fade-in space-y-8 text-left w-full relative z-10">
                    <div className="border-b-2 border-primary/20 pb-4 mb-6 flex justify-between items-center">
                        <h2 className="text-2xl font-bold text-primary flex items-center gap-2">
                            <SettingsIcon /> 管理者メニュー
                        </h2>
                        <button onClick={handleUpdatePin} className="text-xs bg-surface border border-primary/20 text-primary font-bold px-3 py-1.5 rounded-lg hover:bg-white shadow-sm">
                            🔑 パスワード変更
                        </button>
                    </div>
                    
                    <div className="p-6 bg-surface rounded-2xl border-2 border-secondary/30 shadow-sm relative overflow-hidden">
                        <h3 className="font-bold text-xl text-primary mb-4 flex items-center gap-2 relative z-10">
                            🌿 月次エクセル出力
                        </h3>
                        <p className="text-sm text-primary/80 mb-4 font-medium">対象月を選んでボタンを押すだけで出力できます。</p>
                        
                        <div className="flex flex-col gap-4">
                            <div>
                                <label className="block text-sm font-bold text-primary mb-2">出力したい対象月</label>
                                <input type="month" value={targetMonth} onChange={(e) => setTargetMonth(e.target.value)} className="border-2 border-primary/30 text-lg p-2 rounded-xl focus:border-secondary font-bold text-primary bg-white" />
                            </div>
                            <button onClick={handleExportWithTemplate} className="w-full bg-gradient-to-r from-secondary to-[#65a30d] hover:brightness-110 text-white font-bold py-4 px-6 rounded-xl shadow-md transition-all active:scale-95 text-lg border-b-4 border-[#4d7c0f] flex items-center justify-center gap-2">
                                📥 エクセルファイルを出力する
                            </button>
                            {staffList.some(s => s.isOutsourced) && (
                                <button onClick={handleExportOutsourced} className="w-full bg-gradient-to-r from-orange-400 to-orange-500 hover:brightness-110 text-white font-bold py-4 px-6 rounded-xl shadow-md transition-all active:scale-95 text-lg border-b-4 border-orange-600 flex items-center justify-center gap-2">
                                    📋 外注者エクセルを出力する（給与計算付き）
                                </button>
                            )}
                        </div>
                    </div>

                    <div className="p-6 bg-blue-50 rounded-2xl border-2 border-blue-200 shadow-sm text-left">
                        <h3 className="font-bold text-xl text-primary mb-4 flex items-center gap-2">
                            ☁️ クラウド双方向同期設定（Googleスプレッドシート連携）
                        </h3>
                        <p className="text-sm text-primary/70 mb-3">Google Apps Scriptのデプロイ後に表示されるURLを入力してください。</p>
                        <div className="flex gap-2 mb-3">
                            <input type="url" value={gasUrl} onChange={(e) => setGasUrl(e.target.value)} placeholder="https://script.google.com/macros/s/xxxxx/exec" className="flex-1 border-2 border-blue-300 p-3 rounded-xl focus:border-blue-500 text-sm bg-white" />
                        </div>
                        <div className="flex flex-wrap items-center gap-2 mb-3">
                            <span className={`inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-bold ${gasUrl ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'}`}>
                                {gasUrl ? '✅ 連携ON' : '⏸ 未設定'}
                            </span>
                            {gasUrl && <button onClick={async () => { try { const r = await fetch(gasUrl + '?action=ping'); const j = await r.json(); alert(j.status === 'ok' ? '✅ 接続成功！GASと正常に通信できています。' : '⚠️ 応答がありましたが想定外です: ' + JSON.stringify(j)); } catch(e) { alert('接続テスト失敗: ' + e.message + '\n\n※初回はGASのアクセス許可が必要です。'); } }} className="px-4 py-1.5 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-lg text-xs transition-colors">🔗 接続テスト</button>}
                            {gasUrl && <button onClick={async () => { const result = await syncFromGAS(); if (result.success) alert('✅ 同期完了！' + result.count + '件のデータを取得しました。'); else alert('❌ 同期失敗: ' + result.message + '\n\nGASの再デプロイが必要な場合があります。手順書をご確認ください。'); }} disabled={syncStatus.state === 'loading'} className="px-4 py-1.5 bg-teal-500 hover:bg-teal-600 disabled:opacity-50 text-white font-bold rounded-lg text-xs transition-colors flex items-center gap-1">{syncStatus.state === 'loading' ? '⏳ 同期中...' : '🔄 今すぐ全データ同期'}</button>}
                        </div>
                        {gasUrl && syncStatus.lastSync && (
                            <div className={`text-xs font-bold px-3 py-2 rounded-lg mb-2 ${
                                syncStatus.state === 'error' ? 'bg-red-50 text-red-600' :
                                syncStatus.state === 'loading' ? 'bg-blue-50 text-blue-600' :
                                'bg-green-50 text-green-700'
                            }`}>
                                {syncStatus.state === 'loading' ? '⏳ 同期中...' :
                                 syncStatus.state === 'error' ? '❌ ' + syncStatus.message :
                                 '✅ 最終同期: ' + syncStatus.lastSync}
                            </div>
                        )}
                        {/* 【2026-11-08】未送信の確認・書き出し（3.6-11 反映・戻すときの確認用） */}
                        <div id="admin-pending-panel" className={`text-xs font-bold px-3 py-2 rounded-lg mb-2 border ${pendingCount > 0 ? 'bg-red-50 text-red-700 border-red-200' : 'bg-green-50 text-green-700 border-green-200'}`}>
                            <span>{pendingCount > 0 ? `⚠ 未送信 ${pendingCount}件` : '✅ 未送信 0件'}（版 {APP_VERSION}）</span>
                            <span className="inline-flex gap-2 ml-2">
                                <button onClick={async () => { const r = flushQueue ? await flushQueue({ force: true }) : null; alert(r && r.remaining === 0 ? '✅ 未送信はありません（すべて届きました）' : `⚠ まだ未送信が ${r ? r.remaining : '?'}件あります。通信状態を確かめてください。`); }} className="px-2 py-1 bg-white border border-current rounded">今すぐ送信</button>
                                <button id="download-pending-btn" onClick={() => downloadPendingOps && downloadPendingOps()} className="px-2 py-1 bg-white border border-current rounded">未送信を書き出す</button>

                        </div>
                        <div id="device-name-panel" className="text-xs px-3 py-2 rounded-lg mb-2 border bg-white border-primary/20 text-primary flex flex-wrap items-center gap-2">
                            <span className="font-bold">この端末の名前</span>
