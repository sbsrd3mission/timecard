        const OP_RESEND_INTERVAL_MS = 20000; // 再送: 起動時・画面に戻ったとき・20秒ごと
        const POLL_INTERVAL_MS = 10000;    // 自動同期 3秒→10秒（画面が裏のときは止める）
        const GET_RECORD_TIMEOUT_MS = 5000; // 名前選択時の取り直しは最大5秒（3.6-7）
        const CLOCK_SKEW_WARN_MS = 2 * 60 * 1000; // 時計のずれ警告（3.6-1）
        const PUNCH_TIME_FIELDS = ['clockIn', 'breakStart', 'breakEnd', 'clockOut'];

        const loadOpQueue = () => {
            const q = safeParseJSON(localStorage.getItem(OP_QUEUE_KEY), []);
            return Array.isArray(q) ? q.filter(o => o && typeof o === 'object' && o.opId && o.type) : [];
        };
        const saveOpQueue = (q) => { localStorage.setItem(OP_QUEUE_KEY, JSON.stringify(q)); };
        // 未送信リストの変更は必ず「読む→直す→書く」を同期的に1回で行う（await をはさまない）
        const updateOpQueue = (fn) => { const q = fn(loadOpQueue()); saveOpQueue(q); return q; };
        const newOpId = () => 'op_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
        const recordIdOf = (op) => `${op.staffName}_${op.date}`;

        // 端末の識別（店舗PC / タブレット）: 端末名（管理画面で1回だけ付ける・3.11-5）があればそれ、無ければ自動の印
        const getDeviceName = () => localStorage.getItem('timecard_device_name') || '';
        const getDeviceId = () => { getSenderLabel0(); return localStorage.getItem('timecard_device_id'); };
        // 送信元: スプレッドシート15列目に残す
        const getSenderLabel = () => { const id = getSenderLabel0(); const name = getDeviceName(); return name ? name + '(' + id + ')' : id; };
        const getSenderLabel0 = () => {
            let id = localStorage.getItem('timecard_device_id');
            if (!id) {
                const ua = navigator.userAgent || '';
                const isTablet = /iPad|Android|Tablet|Mobile|iPhone/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
                id = (isTablet ? 'タブレット' : 'PC') + '-' + Math.random().toString(36).slice(2, 6);
                localStorage.setItem('timecard_device_id', id);
            }
            return id;
        };

        // 手元の記録に操作を重ねる（GAS 側の planPunch / planEdit / planDelete / planLegacy と同じルール。表示用）
        // 新旧は操作した時刻（at）で決め、項目ごとの記録 fields = { 項目: { t: 操作時刻(ms), m: 手修正済み } } を使う（3.6-2・3.6-5）
        const blankRecord = (staffName, date) => ({
            id: `${staffName}_${date}`, staffName, date,
            clockIn: null, breakStart: null, breakEnd: null, clockOut: null,
            meal: false, isPaidLeave: false, remarks: '', additionalBreakMins: null, transport: null, fields: {}
        });
        const fieldOf = (rec, f) => { const x = rec.fields && rec.fields[f]; return { t: (x && Number(x.t)) || 0, m: !!(x && x.m), L: !!(x && x.L) }; };
        const ALL_RECORD_FIELDS = ['clockIn', 'breakStart', 'breakEnd', 'clockOut', 'meal', 'transport', 'remarks', 'additionalBreakMins', 'isPaidLeave', 'deleted'];
        // 時計のずれ（3.11-3・3.12-2）: 起動時（最初に）と10分ごとに GET ?action=ping で測った「サーバー時刻－端末時刻」（往復の真ん中で求める）。
        // 操作を作るときにその値を offsetAtOp として一緒に保存し、比べるときは常に at＋offsetAtOp（測れていない操作は at のまま）。
        const CLOCK_OFFSET_KEY = 'timecard_clock_offset_ms';
        const CLOCK_MEASURE_INTERVAL_MS = 10 * 60 * 1000;
        const CLOCK_MEASURE_MAX_RTT_MS = 5000;
        // 出力前の確認（3.12-4）: 登録端末の最後の知らせがこれより新しく、未送信0件であること
        const DEVICE_REPORT_FRESH_MS = 10 * 60 * 1000;
        // 端末の知らせ: 件数が変わったとき、または前の知らせからこれだけ経ったとき
        const DEVICE_REPORT_INTERVAL_MS = 3 * 60 * 1000;
        // 端末の表示名（コードレビュー1-8）: 名前の無い端末は ID で示す
        const deviceLabel = (d) => d && d.name ? d.name : `名前なし（ID ${String(d && d.id || '').slice(0, 12)}）`;
        const formatAge = (ms) => { const m = Math.round(Number(ms) / 60000); return m < 60 * 24 ? `${m}分` : `${Math.round(m / 60 / 24)}日`; };
        // 当てられなかった・受け付けられなかった操作の中身（コードレビュー1-4）: 管理者が何を入れ直すか分かるように書く
        const OP_FIELD_LABELS = { clockIn: '出勤', breakStart: '中抜け開始', breakEnd: '中抜け終了', clockOut: '退勤', meal: '賄い', transport: '交通費', remarks: '備考', additionalBreakMins: '休憩分数', isPaidLeave: '有給', deleted: '削除' };
        const fmtOpValue = (f, v) => {
            if (v === null || v === undefined || v === '') return 'なし';
            if (f === 'meal' || f === 'isPaidLeave' || f === 'deleted') return v ? 'あり' : 'なし';
            if (f === 'additionalBreakMins') return `${v}分`;
            if (f === 'transport') return `${v}円`;
            if (['clockIn', 'breakStart', 'breakEnd', 'clockOut'].includes(f)) return String(v).slice(0, 5);
            return String(v);
        };
        const describeOp = (op) => {
            if (!op || typeof op !== 'object') return '';
            const d = op.data || {};
            const kv = (obj) => Object.keys(obj || {}).filter(f => OP_FIELD_LABELS[f]).map(f => `${OP_FIELD_LABELS[f]}=${fmtOpValue(f, obj[f])}`);
            let body = '';
            if (op.type === 'punch') body = ['打刻', d.field ? `${OP_FIELD_LABELS[d.field] || d.field} ${fmtOpValue(d.field, d.time)}` : '情報のみ'].concat(kv(d.attrs)).join(' ');
            else if (op.type === 'edit') body = ['修正'].concat(kv(d.fields)).join(' ');
            else if (op.type === 'delete') body = '完全取消';
            else if (op.type === 'confirm') body = `本人確認 ${d.yearMonth || ''}`;
            else if (op.type === 'legacy') body = ['古い版の未送信'].concat(kv(d)).join(' ');
            else body = String(op.type || '');
            const at = op.at ? new Date(op.at).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' }) : '';
            return body + (at ? `（操作 ${at}）` : '');
        };
        const getClockOffset = () => { const v = localStorage.getItem(CLOCK_OFFSET_KEY); const n = v === null ? NaN : Number(v); return isFinite(n) ? n : null; };
        // 比べる時刻（GAS の normalizeOpTime と同じ）
        const opCompareTime = (op) => {
            const at = Date.parse(op.at) || Date.now();
            const off = Number(op.offsetAtOp);
            return (op.offsetAtOp !== undefined && op.offsetAtOp !== null && op.offsetAtOp !== '' && isFinite(off)) ? at + off : at; // 測れていれば常に足す（3.12-2）
        };
        // 有給の設定で空にする項目（GAS の LEAVE_BLANK_FIELDS と同じ）
        const LEAVE_BLANK_FIELDS = ['clockIn', 'breakStart', 'breakEnd', 'clockOut', 'additionalBreakMins', 'transport', 'meal'];
        const applyOpToRecord = (base, op) => {
            const rec = { ...(base || blankRecord(op.staffName, op.date)) };
            rec.fields = { ...((base && base.fields) || {}) };
            const at = opCompareTime(op);
            const d = op.data || {};
            const set = (f, v, mark) => {
                rec[f] = v;
                const prev = rec.fields[f] || {};
                const e = { t: at };
                // 有給で空にする項目は手修正印を外して「有給による空欄」印に置き換える（3.9-7）
                if (mark === 'm' || (prev.m && mark !== 'L')) e.m = 1;
                if (mark === 'L') e.L = 1;
                rec.fields[f] = e;
            };
            const del = fieldOf(rec, 'deleted');
            if (rec.deleted && del.t && at < del.t) return rec; // 削除より前の操作は書かない
            const doDelete = () => {
                if (rec.deleted) return rec;
                const maxT = Math.max(0, ...ALL_RECORD_FIELDS.map(f => fieldOf(rec, f).t));
                if (at < maxT) return rec; // 古い削除は効かない（3.7-2）
                const out = { ...blankRecord(op.staffName, op.date), deleted: true, fields: {} };
                ALL_RECORD_FIELDS.forEach(f => { out.fields[f] = { t: at }; });
                return out;
            };
            if (op.type === 'punch') {
                if (rec.deleted || rec.isPaidLeave) return rec;
                if (d.field && d.time) { const fi = fieldOf(rec, d.field); if (!rec[d.field] && !fi.m && at >= fi.t) set(d.field, d.time); }
                Object.keys(d.attrs || {}).forEach(k => { const fi = fieldOf(rec, k); if (!fi.m && at >= fi.t) set(k, d.attrs[k]); });
            } else if (op.type === 'edit') {
                const f = d.fields || {};
                const hasLeave = Object.prototype.hasOwnProperty.call(f, 'isPaidLeave');
                const leaveSet = f.isPaidLeave === true;
                let any = false;
                if (hasLeave) {
                    // 有給の設定・取消は行全体: 行のどの項目より新しいときだけ（3.8-4）
                    const maxT = Math.max(0, ...ALL_RECORD_FIELDS.map(k => fieldOf(rec, k).t));
                    if (at < maxT) return rec;
                    set('isPaidLeave', leaveSet, 'm'); any = true;
                    if (leaveSet) LEAVE_BLANK_FIELDS.forEach(k => set(k, k === 'meal' ? false : null, 'L'));
                    else Object.keys(rec.fields).forEach(k => { if (rec.fields[k].L) { const { L, ...rest } = rec.fields[k]; rec.fields[k] = rest; } });
                }
                Object.keys(f).forEach(k => {
                    if (k === 'isPaidLeave') return;
                    if (leaveSet && LEAVE_BLANK_FIELDS.includes(k)) return; // 有給の日は空のまま
                    if (at >= fieldOf(rec, k).t) { set(k, f[k], 'm'); any = true; }
                });
                if (any && rec.deleted) rec.deleted = false;
                if (any && d.selfEdit) rec.selfEdited = true;
            } else if (op.type === 'delete') {
                return doDelete();
            } else if (op.type === 'legacy') {
                if (d.deleted === true) return doDelete();
                if (rec.deleted) return rec;
                if (!rec.isPaidLeave) PUNCH_TIME_FIELDS.forEach(k => { const fi = fieldOf(rec, k); if (d[k] && !rec[k] && !fi.m && at >= fi.t) set(k, d[k]); });
                ['meal', 'transport', 'remarks', 'additionalBreakMins', 'isPaidLeave'].forEach(k => {
                    if (!Object.prototype.hasOwnProperty.call(d, k)) return;
                    const fi = fieldOf(rec, k);
                    if (!fi.m && at >= fi.t) set(k, d[k]);
                });
            } else {
                return rec;
            }
            if (!rec.clientUpdatedAt || Date.parse(rec.clientUpdatedAt) < at) rec.clientUpdatedAt = new Date(at).toISOString();
            return rec;
        };
        // 未送信の操作を、操作した時刻の順に重ねる
        const replayOps = (base, ops) => [...ops].sort((a, b) => opCompareTime(a) - opCompareTime(b)).reduce((rec, op) => applyOpToRecord(rec, op), base);

        // 古い版の未送信（1日分まるごと）を legacy 操作に変える（3.5-4・3.6-6・3.7-9）。
        // 既定値でない値（時刻欄＝値あり、賄い＝あり、交通費＝数値、備考＝空でない、休憩分数＝1以上、有給＝あり、削除＝あり）は data に入れて当てる。
        // 既定値（なし・0・空）だった項目は名前だけ cleared に入れる。サーバーがクラウドの今の値と比べ、
        // 当てなかった項目を理由と一緒に返し、管理画面の「移行できなかった未送信」に出す（timecard_legacy_unmigrated）。
        // 変える前に、古い未送信と手元の記録を端末内に控える（timecard_pre_v3_backup）。
        const legacyDataOf = (p) => {
            const isDelete = p.deleted === true || p.deleted === 'true' || (typeof p.remarks === 'string' && p.remarks.includes('【完全削除済】'));
            if (isDelete) return { deleted: true };
            const d = {};
            const cleared = [];
            PUNCH_TIME_FIELDS.forEach(k => { if (p[k]) d[k] = p[k]; else cleared.push(k); });
            if (p.meal === true) d.meal = true; else cleared.push('meal');
            if (p.transport !== null && p.transport !== undefined && p.transport !== '' && !isNaN(parseInt(p.transport))) d.transport = parseInt(p.transport); else cleared.push('transport');
            if (typeof p.remarks === 'string' && p.remarks.trim()) d.remarks = p.remarks; else cleared.push('remarks');
            if (parseInt(p.additionalBreakMins) >= 1) d.additionalBreakMins = parseInt(p.additionalBreakMins); else cleared.push('additionalBreakMins');
            if (p.isPaidLeave === true) d.isPaidLeave = true; else cleared.push('isPaidLeave');
            d.cleared = cleared;
            return d;
        };
        const migrateLegacyPending = () => {
            const oldPending = safeParseJSON(localStorage.getItem('timecard_pending_sync'), null);
            if (!localStorage.getItem('timecard_pre_v3_backup')) {
                localStorage.setItem('timecard_pre_v3_backup', JSON.stringify({
                    savedAt: new Date().toISOString(),
                    pending: Array.isArray(oldPending) ? oldPending : [],
                    records: safeParseJSON(localStorage.getItem('timecard_records'), [])
                }));
            }
            if (!Array.isArray(oldPending)) { localStorage.removeItem('timecard_pending_sync'); return; }
            updateOpQueue(q => {
                oldPending.filter(p => p && p.staffName && /^\d{4}-\d{2}-\d{2}$/.test(String(p.date || ''))).forEach(p => {
                    const opId = 'legacy_' + p.staffName + '_' + p.date + '_' + (p.clientUpdatedAt || '');
                    if (q.some(o => o.opId === opId)) return;
                    const data = legacyDataOf(p);
                    q.push({ opId, type: 'legacy', staffName: p.staffName, date: p.date, at: p.clientUpdatedAt || new Date().toISOString(), data });
                });
                return q;
            });
            localStorage.removeItem('timecard_pending_sync');
        };
        try { migrateLegacyPending(); } catch (e) { console.error('migrateLegacyPending failed', e); }

        const useAppData = (onError) => {
            const [staffList, setStaffList] = useState(() => {
                const withDefaults = (s) => {
                    const base = typeof s === 'string' ? { name: s, defaultMeal: false } : s;
                    return { isOutsourced: false, hourlyRate: 1200, dailyTransport: 0, ...base };
                };
                const saved = safeParseJSON(localStorage.getItem('timecard_staff_v2'), null);
                if (Array.isArray(saved) && saved.length > 0) return saved.map(withDefaults);

                const oldSaved = safeParseJSON(localStorage.getItem('timecard_staff'), null);
                if (Array.isArray(oldSaved) && oldSaved.length > 0) {
                    return oldSaved.map(withDefaults);
                }
                return DEFAULT_SEED_NAMES.map(name => ({
                    name, defaultMeal: false, isOutsourced: false, hourlyRate: 1200, dailyTransport: 0
                }));
            });

            const [timeRecords, setTimeRecords] = useState(() => {
                const saved = safeParseJSON(localStorage.getItem('timecard_records'), []);
                return Array.isArray(saved) ? saved : [];
            });

            // クラウド(GAS)から設定を一度でも正常受信できたかのフラグ。
            // これが立つまでは設定のクラウド保存(saveSettingsToGAS)を一切許可しない（障害⑥対策の中核ガード）
            const settingsHydratedRef = useRef(localStorage.getItem('timecard_settings_hydrated') === 'true');
            // この端末が最後にローカルで設定（名簿・PIN等）を変更した時刻(ISO)。
            // クラウドから取得した設定がこれより古い場合は「保存がまだ反映されていない古いデータ」とみなして
            // 反映をスキップする（削除直後にポーリングが古い名簿を拾って復活させる不具合の対策）。
            // ※メモリ上のみ（リロードで自然にリセット）。永続化すると保存失敗時に更新が固着するため。
            const localSettingsUpdatedAtRef = useRef('');

            // パスワード設定（デフォルトは 0000）
            const [adminPin, setAdminPin] = useState(() => {
                return localStorage.getItem('admin_pin') || '0000';
            });

            // GAS連携URL（最新デプロイへの確実な自動マイグレーション対応）
            const [gasUrl, setGasUrl] = useState(() => {
                // 各端末に保存済みの URL がこの定数と違えば、定数に合わせる（今の自動移行の役目）
                const newUrl = GAS_URL;
                const stored = localStorage.getItem('timecard_gas_url') || '';
                if (stored !== newUrl) {
                    localStorage.setItem('timecard_gas_url', newUrl);
                    return newUrl;
                }
                return stored;
            });

            // 同期ステータス
            const [syncStatus, setSyncStatus] = useState({ state: 'idle', message: '', lastSync: localStorage.getItem('timecard_last_sync') || '' });
            // 月次確認（スタッフ名|YYYY-MM → 確認日時）
            const [confirmations, setConfirmations] = useState(() => safeParseJSON(localStorage.getItem('timecard_confirmations'), {}));
            useEffect(() => { localStorage.setItem('timecard_confirmations', JSON.stringify(confirmations)); }, [confirmations]);

            useEffect(() => { localStorage.setItem('timecard_staff_v2', JSON.stringify(staffList)); }, [staffList]);
            useEffect(() => { localStorage.setItem('timecard_records', JSON.stringify(timeRecords)); }, [timeRecords]);
            useEffect(() => { localStorage.setItem('admin_pin', adminPin); }, [adminPin]);
            useEffect(() => { localStorage.setItem('timecard_gas_url', gasUrl); }, [gasUrl]);

            // 既存スタッフの賄い設定を一括で「なし (false)」にリセットする1回限りのマイグレーション
            // 【障害⑥対策】新しい端末（初期値名簿のまま）ではローカル変更のみ行い、クラウドへは絶対に送信しない。
            // クラウド送信はGASから正規の設定を受信済み（hydrated）の端末に限定する。
            useEffect(() => {
                const migrated = localStorage.getItem('timecard_meal_reset_20260621');
                if (!migrated && staffList.length > 0) {
                    const updatedList = staffList.map(s => ({ ...s, defaultMeal: false }));
                    setStaffList(updatedList);
                    if (settingsHydratedRef.current && !isDefaultSeedList(updatedList)) {
                        saveSettingsToGAS(updatedList, adminPin);
                    }
                    localStorage.setItem('timecard_meal_reset_20260621', 'true');
                }
            }, []);

            // ===== 設定の同期（スタッフリスト、PINコード） =====
            // 【障害⑥対策ガード】以下の場合はクラウド保存を拒否する:
            //   1. 名簿が空・不正型（同期異常でStateが壊れた場合の防波堤）
            //   2. 名簿が初期値（仮データ）そのもの → 本番を初期値で上書きする事故を根絶
            //   3. クラウドから一度も設定を受信していない端末（新端末・キャッシュクリア直後）
            const saveSettingsToGAS = async (newList, newPin) => {
                if (!gasUrl) return;
                const listToSave = newList || staffList;
                if (!Array.isArray(listToSave) || listToSave.length === 0) {
                    console.warn('saveSettingsToGAS: 名簿が空のため保存を拒否しました');
                    return;
                }
                if (isDefaultSeedList(listToSave)) {
                    console.warn('saveSettingsToGAS: 初期値名簿（仮データ）のため保存を拒否しました（障害⑥ガード）');
                    return;
                }
                if (!settingsHydratedRef.current) {
                    console.warn('saveSettingsToGAS: クラウド設定が未受信の端末のため保存を拒否しました（障害⑥ガード）');
                    return;
                }
                // 設定変更時刻を付与し、この端末のローカル基準時刻として記録しておく。
                // （クラウド保存はno-corsで完了を待てないため、直後のポーリングが古い名簿を
                //   返してきても、この時刻より古ければ反映をスキップして削除等を保持する）
                const settingsTs = new Date().toISOString();
                localSettingsUpdatedAtRef.current = settingsTs;
                try {
                    await fetch(gasUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({
                            action: 'saveSettings',
                            settings: {
                                staffList: listToSave,
                                adminPin: newPin || adminPin,
                                settingsUpdatedAt: settingsTs
                            }
                        })
                    });
                } catch(e) { console.error('Save settings failed', e); }
            };

            const syncSettingsFromGAS = async (url) => {
                const targetUrl = url || gasUrl;
                if (!targetUrl) return;
                try {
                    const response = await fetch(targetUrl + '?action=getSettings', { method: 'GET' });
                    if (!response.ok) return;
                    const data = await response.json();
                    if (data && data.status === 'ok') {
                        // クラウドと正常に疎通し設定応答を受信できた時点で hydrated フラグを立てる
                        // （設定が未作成 = null の場合も「クラウドの正しい状態を確認済み」とみなす）
                        settingsHydratedRef.current = true;
                        localStorage.setItem('timecard_settings_hydrated', 'true');
                    }
                    if (data && data.status === 'ok' && data.settings) {
                        // 【新旧判定】この端末でローカル変更した時刻より、クラウドの設定が古い（または時刻が無い）場合は
                        // 「まだ自分の保存が反映されていない古いデータ」とみなし、名簿・PINの反映をスキップする。
                        // （削除直後のポーリングが削除前の名簿を拾って復活させる不具合の対策）
                        const cloudTs = data.settings.settingsUpdatedAt ? String(data.settings.settingsUpdatedAt) : '';
                        const localTs = localSettingsUpdatedAtRef.current || '';
                        const cloudIsStale = localTs && (!cloudTs || cloudTs < localTs);

                        if (cloudIsStale) {
                            console.warn('syncSettingsFromGAS: クラウド設定が自端末の変更より古いため名簿・PINの反映をスキップ（削除復活防止）');
                        } else {
                            // 【型バリデーション】配列であり、有効な名前を持つ要素が1件以上ある場合のみStateへ反映。
                            // 空配列・不正型はStateを破壊しないため無視する（障害①③類似パターン対策）
                            if (Array.isArray(data.settings.staffList)) {
                                const withDefaults = (s) => {
                                    const base = typeof s === 'string' ? { name: s, defaultMeal: false } : s;
                                    return { isOutsourced: false, hourlyRate: 1200, dailyTransport: 0, ...base };
                                };
                                const validList = data.settings.staffList
                                    .filter(s => (typeof s === 'string' && s.trim()) || (s && typeof s === 'object' && typeof s.name === 'string' && s.name.trim()))
                                    .map(withDefaults);
                                if (validList.length > 0) {
                                    setStaffList(validList);
                                } else {
                                    console.warn('syncSettingsFromGAS: クラウドの名簿が空または不正のため反映をスキップしました');
                                }
                            }
                            if (data.settings.adminPin && /^\d{4}$/.test(String(data.settings.adminPin))) {
                                setAdminPin(String(data.settings.adminPin));
                            }
                            // 反映できた＝クラウドが最新に追いついたので、以後は通常同期に戻すためローカル基準時刻を合わせる
                            if (cloudTs) localSettingsUpdatedAtRef.current = cloudTs;
                        }

                        // 月次確認（confirmations）は名簿とは別系統のため、新旧判定に関わらず常に反映する
                        if (data.settings.confirmations && typeof data.settings.confirmations === 'object') {
                            // 本人確認の予備確認（届いた確認は未送信リストから消す）。まだ届いていない確認は手元の表示を残す
                            confirmOpsBySettings(data.settings.confirmationOps);
                            const pendingConfirm = {};
                            loadOpQueue().filter(op => op.type === 'confirm' && op.data && op.data.yearMonth).forEach(op => {
                                const k = `${op.staffName}|${op.data.yearMonth}`;
                                pendingConfirm[k] = new Date(op.at).toLocaleString('sv-SE', { timeZone: 'Asia/Tokyo' }).slice(0, 16);
                            });
                            setConfirmations({ ...data.settings.confirmations, ...pendingConfirm });
                        }
                        console.log('Settings synced from GAS');
                    }
                } catch(e) { console.error('Sync settings failed', e); }
            };

            // === 同期の考え方（2026-11-08 改修） ===
            // 書き込みは「操作（op）」単位で未送信リストに入れ、GAS の返事（opIdごとの結果）を見て消す。
            // 更新時刻はサーバーが付ける。画面の記録は「クラウドの行＋まだ届いていない操作」を重ねて表示する。

            // 未送信件数（打刻画面の「⚠ 未送信 n件」表示用）
            const [pendingCount, setPendingCount] = useState(() => loadOpQueue().length);
            const refreshPendingCount = () => setPendingCount(loadOpQueue().length);
            // 時計のずれ（3.6-1）: サーバーが測った「サーバー時刻－端末時刻」。2分以上なら画面に警告を出す
            const [clockSkewMs, setClockSkewMs] = useState(() => { const o = getClockOffset(); return o !== null && Math.abs(o) >= CLOCK_SKEW_WARN_MS ? o : 0; });
            // 時計のずれを測る（3.11-3）: 往復が5秒を超えた測定は使わない。古い GAS（serverTimeMs が無い）では測らない
            const measureClockOffset = async () => {
                if (!gasUrl) return null;
                try {
                    const t0 = Date.now();
                    const res = await fetch(gasUrl + '?action=ping&clock=1&t=' + t0, { method: 'GET', cache: 'no-store' });
                    const data = await res.json();
                    const t1 = Date.now();
                    if (!data || !isFinite(Number(data.serverTimeMs)) || t1 - t0 > CLOCK_MEASURE_MAX_RTT_MS) return null;
                    const offset = Math.round(Number(data.serverTimeMs) - (t0 + t1) / 2);
                    localStorage.setItem(CLOCK_OFFSET_KEY, String(offset));
                    setClockSkewMs(Math.abs(offset) >= CLOCK_SKEW_WARN_MS ? offset : 0);
                    return offset;
                } catch (e) { return null; }
            };
            // 端末名と未送信の件数を GAS に知らせる（3.11-5）。件数が変わったとき・5分おきだけ送る
            const lastDeviceReportRef = useRef({ pending: -1, at: 0 });
            const reportDeviceStatus = async (force) => {
                if (!gasUrl) return;
                const pending = loadOpQueue().length;
                const last = lastDeviceReportRef.current;
                if (!force && pending === last.pending && Date.now() - last.at < DEVICE_REPORT_INTERVAL_MS) return;
                lastDeviceReportRef.current = { pending, at: Date.now() };
                try {
                    await fetch(gasUrl + '?action=reportDevice&id=' + encodeURIComponent(getDeviceId()) + '&name=' + encodeURIComponent(getDeviceName()) + '&pending=' + pending + '&t=' + Date.now(), { method: 'GET', cache: 'no-store' });
                } catch (e) { lastDeviceReportRef.current = { pending: -1, at: 0 }; }
            };

            // 今までに見た最大の世代番号（3.8-5・3.9-3）。書き込みの返事・opStatus・getAll・getRecord で更新し、
            // これより古い世代の取得結果は表示に使わない。世代番号の無い返事（GAS 更新前の古い GAS）は
            // 「世代なし（最初の状態）」として表示に使う（3.9-7）。
            const maxGenRef = useRef(0);
            const noteGeneration = (g) => { const n = Number(g); if (isFinite(n) && n > maxGenRef.current) maxGenRef.current = n; };
            const isStaleGeneration = (g) => { const n = Number(g); return g !== undefined && g !== null && isFinite(n) && n > 0 && n < maxGenRef.current; };

            // 手元の記録に操作を重ねる（送る前に画面へ反映）
            const applyOpsLocally = (ops) => {
                setTimeRecords(prev => {
                    let next = prev;
                    ops.forEach(op => {
                        if (op.type === 'confirm') return;
                        const id = recordIdOf(op);
                        const cur = next.find(r => r.id === id);
                        const updated = applyOpToRecord(cur, op);
                        const rest = next.filter(r => r.id !== id);
                        next = updated.deleted ? rest : [...rest, updated];
                    });
                    return next;
                });
            };

            // 【コードレビュー1-9】サーバーが打刻の時刻（と日付）を直したとき（時計のずれ2分超）、画面の記録も直した値にする
            const applyServerCorrection = (op, c) => {
                if (!op || !c || !c.field || !c.date || !c.time) return;
                const fromId = `${op.staffName}_${op.date}`;
                const toId = `${op.staffName}_${c.date}`;
                const sentTime = op.data && op.data.time;
                setTimeRecords(prev => {
                    let next = prev;
                    if (fromId !== toId) {
                        next = next.map(r => (r.id === fromId && r[c.field] === sentTime) ? { ...r, [c.field]: null } : r);
                    }
                    const cur = next.find(r => r.id === toId);
                    const updated = cur ? { ...cur, [c.field]: c.time } : { id: toId, staffName: op.staffName, date: c.date, [c.field]: c.time, meal: false, remarks: '', isPaidLeave: false };
                    return [...next.filter(r => r.id !== toId), updated];
                });
            };

            // 操作を未送信リストに入れて、すぐ送る
            const enqueueOps = (ops) => {
                if (!ops || ops.length === 0) return;
                const offset = getClockOffset();
                const stamped = ops.map(op => {
                    const o = { ...op, opId: op.opId || newOpId(), at: op.at || new Date().toISOString(), sentAt: null };
                    if (o.offsetAtOp === undefined && offset !== null) o.offsetAtOp = offset; // 操作を作ったときのずれ（3.11-3）
                    return o;
                });
                updateOpQueue(q => q.concat(stamped));
                // 15秒保護（全件取得の取り込みを止める）は今までどおり掛ける。再送はこの保護の対象外。
                localStorage.setItem('timecard_local_update_time', Date.now().toString());
                refreshPendingCount();
                flushQueue();
            };
            const recordOps = (ops) => {
                // 操作を作ったときのずれ（offsetAtOp）を先に付けてから、手元に重ねて送る（3.11-3）
                const offset = getClockOffset();
                const withOffset = ops.map(op => (op.offsetAtOp === undefined && offset !== null) ? { ...op, offsetAtOp: offset } : op);
                applyOpsLocally(withOffset); enqueueOps(withOffset);
            };

            // ===== 未送信の送信・再送 =====
            // no-cors をやめて返事を読む（keepalive 付き）。判定は HTTP ではなく返事の中身。
            const flushingRef = useRef(null);
            const flushQueue = async (opts = {}) => {
                if (!gasUrl) return { ok: false, remaining: loadOpQueue().length };
                if (flushingRef.current) return flushingRef.current;
                const run = (async () => {
                    // 返事が読めなかった操作（一度送ったもの）は、まず GET ?action=opStatus で結果を確かめる（3.6-4）
                    await checkOpStatus();
                    const now = Date.now();
                    const ready = loadOpQueue().filter(o => opts.force || !o.sentAt || now - o.sentAt >= OP_INFLIGHT_MS);
                    let allOk = true;
                    if (ready.length > 0) {
                        const sender = getSenderLabel();
                        const bodyOf = (ops) => JSON.stringify({ action: 'ops', clientVersion: CLIENT_VERSION, sender, sentAt: Date.now(), ops: ops.map(({ sentAt, attempts, ...rest }) => rest) });
                        const sizeOf = (ops) => new Blob([bodyOf(ops)]).size;
                        const batches = [];
                        let cur = [];
                        ready.forEach(op => {
                            if (cur.length > 0 && sizeOf([...cur, op]) >= OP_BATCH_MAX_BYTES) { batches.push(cur); cur = []; }
                            cur.push(op);
                        });
                        if (cur.length > 0) batches.push(cur);

                        for (const batch of batches) {
                            const ids = new Set(batch.map(o => o.opId));
                            const sentAt = Date.now();
                            updateOpQueue(q => q.map(o => ids.has(o.opId) ? { ...o, sentAt, attempts: (o.attempts || 0) + 1 } : o));
                            let done = new Set();
                            try {
                                const res = await fetch(gasUrl, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                    body: bodyOf(batch),
                                    keepalive: true
                                });
                                const data = await res.json();
                                if (data && data.status === 'ok' && data.results && typeof data.results === 'object') {
                                    noteGeneration(data.generation);
                                    Object.keys(data.results).forEach(id => {
                                        const r = data.results[id] && data.results[id].result;
                                        if (r === 'applied' || r === 'skipped') done.add(id);
                                        noteLegacyResult(batch.find(o => o.opId === id), data.results[id]);
                                        if (data.results[id] && data.results[id].corrected) applyServerCorrection(batch.find(o => o.opId === id), data.results[id].corrected);
                                        if (r === 'invalid') {
                                            // 何度送っても受け付けられない操作は控えに移して外す
                                            const dead = safeParseJSON(localStorage.getItem('timecard_op_dead'), []);
                                            const op = batch.find(o => o.opId === id);
                                            if (op) {
                                                dead.push({ ...op, reason: data.results[id].reason || '' }); localStorage.setItem('timecard_op_dead', JSON.stringify(dead.slice(-100)));
                                                // 管理画面の一覧にも中身付きで出す（コードレビュー1-4）
                                                addAttentionItem(op, 'invalid', 'サーバーが受け付けませんでした: ' + (data.results[id].reason || '理由不明'));
                                            }
                                            done.add(id);
                                        }
                                    });
                                } else {
                                    allOk = false;
                                    if (data && data.message === 'old_client' && onError) onError('OLD_CLIENT', 'サーバーがこのアプリの版を受け付けませんでした。\n「最新版に強制再読み込み」を押してください。');
                                }
                            } catch (e) {
                                // 通信断・返事が途中で切れた等: 未送信のまま残し、次の再送で送る（同じ opId は何度届いても同じ結果）
                                allOk = false;
                            }
                            // 届いたものは消し、届かなかったものは「送信中」を外して次回すぐ再送できるようにする
                            updateOpQueue(q => q.filter(o => !done.has(o.opId)).map(o => (ids.has(o.opId) && o.sentAt === sentAt) ? { ...o, sentAt: null } : o));
                            if (batch.some(o => !done.has(o.opId))) allOk = false;
                        }
                    }
                    refreshPendingCount();
                    return { ok: allOk, remaining: loadOpQueue().length };
                })();
                flushingRef.current = run;
                try { return await run; } finally { flushingRef.current = null; }
            };

            // 予備確認（返事が読めなかった端末のため・3.6-4）: 一度送った操作の結果を GET ?action=opStatus で問い合わせ、
            // 結果（applied/skipped/invalid）のある opId だけ未送信から消す。月の範囲に関係なく確かめられる。
            // 古い版の未送信で、当てなかった項目があれば理由と一緒に管理画面の一覧へ（3.7-9）
            // 【3.8-8】新しい操作でも、180日を超えて当てなかった（too_old）・行の方が新しくて当てなかった有給/削除は一覧へ
            const ATTENTION_REASONS = { too_old: '180日より前の操作のため当てませんでした', older_than_row: 'クラウドの記録の方が新しいため当てませんでした（有給の設定・取消／削除）', before_delete: '削除より前の操作のため当てませんでした' };
            const noteLegacyResult = (op, res) => {
                if (!op || !res || !res.reason || res.duplicate) return;
                if (op.type !== 'legacy' && !(res.result === 'skipped' && ATTENTION_REASONS[res.reason])) return;
                if (op.type !== 'legacy') res = { ...res, reason: ATTENTION_REASONS[res.reason] + '（' + ({ punch: '打刻', edit: '修正', 'delete': '完全取消', confirm: '本人確認' }[op.type] || op.type) + '）' };
                addAttentionItem(op, res.result, String(res.reason));
            };
            // 一覧に足す（コードレビュー1-4）: 名前・日付・理由に加えて、操作の中身（op）をそのまま残す（「未送信を書き出す」にも入る）
            const addAttentionItem = (op, result, reason) => {
                const list = safeParseJSON(localStorage.getItem('timecard_legacy_unmigrated'), []);
                if (list.some(x => x.opId === op.opId)) return;
                const { sentAt, attempts, ...content } = op;
                list.push({ opId: op.opId, staffName: op.staffName, date: op.date, result, reason, op: content });
                localStorage.setItem('timecard_legacy_unmigrated', JSON.stringify(list));
            };
            const checkOpStatus = async () => {
                const sentBefore = loadOpQueue().filter(o => (o.attempts || 0) > 0 && !(o.sentAt && Date.now() - o.sentAt < OP_INFLIGHT_MS));
                if (!gasUrl || sentBefore.length === 0) return;
                for (let i = 0; i < sentBefore.length; i += 50) {
                    const ids = sentBefore.slice(i, i + 50).map(o => o.opId);
                    try {
                        const res = await fetch(gasUrl + '?action=opStatus&ids=' + ids.map(encodeURIComponent).join(',') + '&t=' + Date.now(), { method: 'GET', cache: 'no-store' });
                        const data = await res.json();
                        if (!data || data.status !== 'ok' || !data.results) continue;
                        noteGeneration(data.generation);
                        const done = new Set(Object.keys(data.results).filter(id => ['applied', 'skipped', 'invalid'].includes(data.results[id] && data.results[id].result)));
                        done.forEach(id => {
                            noteLegacyResult(sentBefore.find(o => o.opId === id), data.results[id]);
                            if (data.results[id].corrected) applyServerCorrection(sentBefore.find(o => o.opId === id), data.results[id].corrected);
                            const op = sentBefore.find(o => o.opId === id);
                            if (op && data.results[id].result === 'invalid') addAttentionItem(op, 'invalid', 'サーバーが受け付けませんでした: ' + (data.results[id].reason || '理由不明'));
                        });
                        if (done.size > 0) updateOpQueue(q => q.filter(o => !done.has(o.opId)));
                    } catch (e) { /* 次の再送で確かめる */ }
                }
                refreshPendingCount();
            };

            // 本人確認の予備確認（3.5-8）: getSettings の confirmationOps に opId があれば届いている
            const confirmOpsBySettings = (confirmationOps) => {
                if (!confirmationOps || typeof confirmationOps !== 'object') return;
                const done = new Set(Object.values(confirmationOps));
                const before = loadOpQueue().length;
                const after = updateOpQueue(q => q.filter(op => !(op.type === 'confirm' && done.has(op.opId)))).length;
                if (after !== before) refreshPendingCount();
            };

            // 月次確認「今月分を確認しました」をGASへ記録（押すたびに日時上書き）。未送信リスト経由で届くまで再送する。
            const confirmMonth = async (staffName, yearMonth) => {
                const now = new Date().toLocaleString('sv-SE', { timeZone: 'Asia/Tokyo' }).slice(0, 16);
                setConfirmations(prev => ({ ...prev, [`${staffName}|${yearMonth}`]: now }));
                enqueueOps([{ type: 'confirm', staffName, date: `${yearMonth}-01`, data: { yearMonth } }]);
            };

            // 修正画面・管理者の修正: 変えた項目だけを edit 操作で送る（3.5-2）
            const submitEdit = (staffName, date, fields, selfEdit) => {
                if (!fields || Object.keys(fields).length === 0) return;
                recordOps([{ type: 'edit', staffName, date, data: selfEdit ? { fields, selfEdit: true } : { fields } }]);
            };

            const deleteFromGAS = async (recordId) => {
                // スタッフ名に「_」が含まれても正しく分割できるよう、末尾の日付部分で分離する
                const parts = String(recordId).match(/^(.+)_(\d{4}-\d{2}-\d{2})$/);
                if (!parts) { console.warn('deleteFromGAS: 不正なID形式', recordId); return; }
                recordOps([{ type: 'delete', staffName: parts[1], date: parts[2], data: {} }]);
            };

            // 名前を選んだ時点で、その人のその日の行だけを GAS から取る（3.1(4)・3.5冒頭）。最大2秒。
            // 取った行に、この端末の未送信を重ねて表示する（未送信を上書きしない: 3.5-12）
            const fetchTodayRecord = async (staffName, date) => {
                if (!gasUrl || !staffName) return { ok: false };
                const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
                const timer = setTimeout(() => { if (ctrl) ctrl.abort(); }, GET_RECORD_TIMEOUT_MS);
                try {
                    const url = gasUrl + '?action=getRecord&staffName=' + encodeURIComponent(staffName) + '&date=' + date + '&t=' + Date.now();
                    const res = await fetch(url, { method: 'GET', cache: 'no-store', signal: ctrl ? ctrl.signal : undefined });
                    const data = await res.json();
                    if (!data || data.status !== 'ok') return { ok: false };
                    // 今までに見た最大の世代より古い返事は使わない（3.9-3）。手元の方が新しいので確認は済んだ扱い
                    if (isStaleGeneration(data.generation)) return { ok: true, stale: true };
                    noteGeneration(data.generation);
                    const cloud = data.record;
                    const id = `${staffName}_${date}`;
                    const ops = loadOpQueue().filter(op => recordIdOf(op) === id && op.type !== 'confirm');
                    if (cloud || ops.length > 0) {
                        setTimeRecords(prev => {
                            const local = prev.find(r => r.id === id);
                            const base = cloud || local;
                            if (!base && ops.length === 0) return prev;
                            const merged = replayOps(base, ops);
                            const rest = prev.filter(r => r.id !== id);
                            return (merged && !merged.deleted) ? [...rest, merged] : rest;
                        });
                    }
                    return { ok: true };
                } catch (e) {
                    return { ok: false };
                } finally {
                    clearTimeout(timer);
                }
            };

            // 同期の多重実行防止フラグ。前回の同期が完了する前に3秒ポーリング等で
            // 次の同期が始まると、サーバー側の同時実行数が積み上がり404の原因になる。
            const syncInFlightRef = useRef(false);
            // 最後に反映した全件取得の世代番号・取得時刻（3.7-6）
            const lastAppliedFetchRef = useRef({ gen: 0, ts: 0 });

            // ===== GASからデータを取得（直近2か月 / 指定月）=====
            // opts.month = 'YYYYMM' のときはその月だけ取る（古い月の履歴画面）
            const syncFromGAS = async (url, silent, opts) => {
                const targetUrl = url || gasUrl;
                if (!targetUrl) return { success: false, message: 'GAS URLが未設定です' };

                // 前回の同期がまだ実行中ならスキップ（多重実行防止）
                if (syncInFlightRef.current) {
                    return { success: true, count: 0, merged: [], message: '同期実行中のためスキップ' };
                }
                syncInFlightRef.current = true;
                try {
                    return await syncFromGASInner(targetUrl, silent, opts || {});
                } finally {
                    syncInFlightRef.current = false;
                }
            };

            const syncFromGASInner = async (targetUrl, silent, opts) => {

                // ローカル更新直後15秒間は同期をスキップ（初期Race Condition対策）
                const lastUpdate = parseInt(localStorage.getItem('timecard_local_update_time') || '0');
                if (Date.now() - lastUpdate < 15000) {
                    return { success: true, count: 0, merged: [], message: 'ローカル更新直後のためスキップ' };
                }

                if (!silent) setSyncStatus(s => ({ ...s, state: 'loading', message: '同期中...' }));
                try {
                    const rangeParam = opts.month ? '&month=' + opts.month : '&months=2';
                    const cb = '&t=' + Date.now();
                    const response = await fetch(targetUrl + '?action=getAll' + rangeParam + cb, { method: 'GET', cache: 'no-store' });
                    // 【2026-11-08 3.7-12】404 のとき本番 URL に切り替えて送り直す処理は外した（試験で本番に触れないため）
                    if (!response.ok) {
                        throw new Error('HTTP ' + response.status);
                    }
                    const data = await response.json();
                    if (data.status !== 'ok') throw new Error(data.message || '不明なエラー');

                    // 【型バリデーション】不正型・null・ID欠損レコードを除外してからマージ（障害①対策の強化）
                    const gasRecords = (Array.isArray(data.records) ? data.records : [])
                        .filter(r => r && typeof r === 'object' && typeof r.id === 'string' && r.id);

                    // 通信中にローカル更新が起きた場合はスキップ
                    const checkLastUpdate = parseInt(localStorage.getItem('timecard_local_update_time') || '0');
                    if (Date.now() - checkLastUpdate < 15000) {
                        return { success: true, count: 0, merged: [], message: '通信中にローカル更新が起きたためスキップ' };
                    }

                    // 古い取得結果で表示を戻さない（3.7-6・3.8-5）: 今までに見た最大の世代（書き込みの返事を含む）より
                    // 古い世代、または同じ世代でも前に反映したものより前の取得時刻の返事は捨てる。世代番号が無ければ使う（3.9-7）
                    const gen = Number(data.generation) || 0;
                    const ts = Date.parse(data.timestamp) || 0;
                    const last = lastAppliedFetchRef.current;
                    if (isStaleGeneration(data.generation) || (gen > 0 && gen === last.gen && ts < last.ts)) {
                        return { success: true, count: 0, message: '古い取得結果のため捨てました' };
                    }
                    noteGeneration(gen);
                    lastAppliedFetchRef.current = { gen, ts };

                    // 取得した範囲（月）。範囲外の手元データは消さない
                    const months = Array.isArray(data.range) ? data.range : null;
                    const inRange = (date) => !months || months.includes(String(date || '').slice(0, 7).replace('-', ''));

                    // まだ届いていない操作（未送信）を記録ごとにまとめる（更新処理の外で先に作る）
                    const opsById = {};
                    loadOpQueue().forEach(op => {
                        if (op.type === 'confirm') return;
                        const id = recordIdOf(op);
                        (opsById[id] = opsById[id] || []).push(op);
                    });

                    setTimeRecords(prev => {
                        // ローカルデータをMapに変換
                        const localMap = {};
                        prev.forEach(r => { localMap[r.id] = r; });

                        // クラウドデータをMapに変換
                        const cloudMap = {};
                        gasRecords.forEach(r => { cloudMap[r.id] = r; });

                        // 全IDを集める
                        const allIds = new Set([...Object.keys(localMap), ...Object.keys(cloudMap)]);
                        const merged = [];

                        allIds.forEach(id => {
                            const local = localMap[id];
                            const cloud = cloudMap[id];
                            const ops = opsById[id];

                            let winner = null;

                            if (local && !cloud && !inRange(local.date)) {
                                // 取得範囲外の月 → 手元データをそのまま残す
                                winner = local;
                            } else if (ops && ops.length > 0) {
                                // 未送信の操作がある → クラウドの行（無ければ手元）に、未送信を操作した時刻の順に重ねる（3.6-5）
                                winner = replayOps(cloud || local, ops);
                            } else if (cloud) {
                                // 未送信が無い → サーバーの行が正（更新時刻はサーバーが付けるため）
                                winner = cloud;
                            } else if (local) {
                                // ローカルのみ（クラウド側のシートが削除された場合など）→ ローカルデータを採用
                                winner = local;
                            }

                            // winner が null の場合はスキップ（安全弁）
                            if (!winner) return;

                            // Tombstone（削除済みフラグ）がない場合のみ採用
                            // ※ 古いGASコードが deleted を返さない場合のためのフォールバックとして remarks もチェック
                            const isDeleted = (
                                winner.deleted === true || 
                                winner.deleted === "true" || 
                                (typeof winner.remarks === 'string' && winner.remarks.includes("【完全削除済】"))
                            );

                            if (!isDeleted) {
                                merged.push(winner);
                            }
                        });

                        return merged;
                    });

                    // 同期後にローカルの未送信データも送る（再送は20秒ごとにも別に動く）
                    flushQueue();

                    const now = new Date().toLocaleString('ja-JP');
                    localStorage.setItem('timecard_last_sync', now);
                    setSyncStatus({ state: 'success', message: gasRecords.length + '件を取得しました', lastSync: now });
                    return { success: true, count: gasRecords.length };

                } catch(e) {
                    const msg = e.message || '不明なエラー';
                    setSyncStatus(s => ({ ...s, state: 'error', message: '同期失敗: ' + msg }));
                    // サイレントモードでない場合のみUIエラーを表示（自動同期でのエラーはスパムにならないよう抑制）
                    if (!silent && onError) onError('FETCH_FAIL', `最新データの取得に失敗しました。打刻は続けられます。\n管理者に「FETCH_FAIL」のエラーが出たとご連絡ください。\n（詳細: ${msg}）`);
                    return { success: false, message: msg };
                }
            };

            // GAS URL変更時・起動時・定期的に自動同期
            useEffect(() => {
                if (gasUrl) {
                    measureClockOffset().then(() => flushQueue()).then(() => reportDeviceStatus(true));
                    syncFromGAS(gasUrl, true);
                    syncSettingsFromGAS(gasUrl); // 設定情報の同期
                    // 時計のずれは10分ごとに測り直す（3.11-3）
                    const clockId = setInterval(() => { measureClockOffset(); }, CLOCK_MEASURE_INTERVAL_MS);

                    // 10秒ごとに自動同期（画面が裏のときは止める）
                    const intervalId = setInterval(() => {
                        if (document.visibilityState === 'hidden') return;
                        syncFromGAS(gasUrl, true);
                        reportDeviceStatus();
                    }, POLL_INTERVAL_MS);
                    // 未送信の再送は全件取得と切り離して20秒ごと（15秒保護の対象外）
                    const resendId = setInterval(() => { flushQueue().then(() => reportDeviceStatus()); }, OP_RESEND_INTERVAL_MS);

                    // 画面にフォーカスが戻ったときに即座に再送・同期
                    const handleFocus = () => { flushQueue(); syncFromGAS(gasUrl, true); syncSettingsFromGAS(gasUrl); };
                    const handleVisibility = () => {
                        if (document.visibilityState === 'visible') { flushQueue(); syncFromGAS(gasUrl, true); syncSettingsFromGAS(gasUrl); }
                    };
                    window.addEventListener('focus', handleFocus);
                    document.addEventListener('visibilitychange', handleVisibility);

                    return () => {
                        clearInterval(intervalId);
                        clearInterval(resendId);
                        clearInterval(clockId);
                        window.removeEventListener('focus', handleFocus);
                        document.removeEventListener('visibilitychange', handleVisibility);
                    };
                }
            }, [gasUrl]);

            // 「未送信を書き出す」（3.6-11 戻すとき用）: 未送信の操作・移行できなかった未送信・移行前の控えをファイルに保存
            const downloadPendingOps = () => {
                const payload = {
                    exportedAt: new Date().toISOString(), appVersion: APP_VERSION, device: getSenderLabel(),
                    pendingOps: loadOpQueue(),
                    legacyUnmigrated: safeParseJSON(localStorage.getItem('timecard_legacy_unmigrated'), []),
                    deadOps: safeParseJSON(localStorage.getItem('timecard_op_dead'), []),
                    preV3Backup: safeParseJSON(localStorage.getItem('timecard_pre_v3_backup'), null)
                };
                const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `未送信_${getSenderLabel()}_${new Date().toLocaleString('sv-SE', { timeZone: 'Asia/Tokyo' }).replace(/[ :]/g, '-').slice(0, 16)}.json`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return { staffList, setStaffList, timeRecords, setTimeRecords, adminPin, setAdminPin, gasUrl, setGasUrl, recordOps, submitEdit, deleteFromGAS, syncFromGAS, saveSettingsToGAS, syncSettingsFromGAS, syncStatus, confirmations, confirmMonth, flushQueue, pendingCount, fetchTodayRecord, clockSkewMs, downloadPendingOps, reportDeviceStatus };
        };

        // Excel出力時に修正タグを除去して備考をきれいにする（アプリ内の履歴には残る）
        const cleanRemarksForExcel = (text) => {
            if (!text) return '';
            // 【2026-11-08】退勤時に二重になった備考（「A / A」）は、Excel 上だけ1つにまとめる（元データは変えない）。
            // 区切りは前後に空白のある「/」だけ（「10/3」のような日付は区切らない）。
            const parts = String(text).replace(/【本人修正済】/g, '')
                .split(/\s+\/\s*|\s*\/\s+/)
                .map(t => t.replace(/\s{2,}/g, ' ').trim())
                .filter(t => t && t !== '/');
            return parts.filter((t, i) => parts.indexOf(t) === i).join(' / ');
        };

        // 【2026-11-08】オンライン業務欄（3.3-3）: 備考の「数字（カンマ可）＋円」から金額を拾う。拾えなければ null
        const parseOnlineAmount = (text) => {
            const half = String(text || '').replace(/[０-９，]/g, ch => ch === '，' ? ',' : String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
            const m = half.match(/(\d{1,3}(?:,\d{3})+|\d+)\s*円/);
            return m ? parseInt(m[1].replace(/,/g, ''), 10) : null;
        };

        const calculateDuration = (start, end) => {
            if (!start || !end) return 0;
            const parse = t => {
                const [h,m,s] = t.split(':').map(Number);
                return (h || 0) * 3600 + (m || 0) * 60 + (s || 0);
            };
            const diff = parse(end) - parse(start);
            return diff > 0 ? diff : 0;
        };
        
        const formatTimeHM = (t) => t ? t.substring(0, 5) : '';

        // --- 時計コンポーネント ---
        const RealtimeClock = () => {
            const [time, setTime] = useState(new Date());
            useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);
            
            const days = ['日', '月', '火', '水', '木', '金', '土'];
            const dateStr = `${time.getFullYear()}年${time.getMonth() + 1}月${time.getDate()}日 (${days[time.getDay()]})`;

            return (
                <div className="text-center my-4 bg-white/60 p-4 rounded-xl shadow-sm border border-secondary/20">

                    <p className="text-5xl font-bold text-primary tabular-nums tracking-widest mt-1">{timeStr}</p>
                </div>
            );
        };

        // --- モーダル: 編集・自己申請フォーム ---
        const EditRecordModal = ({ recordId, dateStr, dayOfWeek, defaultStaffName, initialRecord, onClose, onSave, isAdmin, isPaidLeaveMode }) => {
            const [clockIn, setClockIn] = useState(initialRecord?.clockIn ? formatTimeHM(initialRecord.clockIn) : '');
            const [clockOut, setClockOut] = useState(initialRecord?.clockOut ? formatTimeHM(initialRecord.clockOut) : '');
            const [breakStart, setBreakStart] = useState(initialRecord?.breakStart ? formatTimeHM(initialRecord.breakStart) : '');
            const [breakEnd, setBreakEnd] = useState(initialRecord?.breakEnd ? formatTimeHM(initialRecord.breakEnd) : '');
            const [additionalBreak, setAdditionalBreak] = useState(initialRecord?.additionalBreakMins || 0);
            const [meal, setMeal] = useState(initialRecord?.meal || false);
            const [editTransport, setEditTransport] = useState(initialRecord?.transport != null ? String(initialRecord.transport) : '');
            const [remarks, setRemarks] = useState(initialRecord?.remarks || '');
            const [isPaidLeave, setIsPaidLeave] = useState(initialRecord?.isPaidLeave || isPaidLeaveMode);

            const handleSave = () => {
                if (isPaidLeave) {
                    const confirmLeave = window.confirm(`${dateStr} を【有給申請】で登録しますか？\n（出勤時刻などの入力内容はクリアされます）`);
                    if (!confirmLeave) return;
                } else {
                    if (!clockIn && clockOut) { alert("🚨 エラー：出勤時間が入力されていません！"); return; }
                    if (clockIn && clockOut && clockOut < clockIn) { alert("🚨 エラー：退勤時間は出勤時間より後である必要があります！"); return; }
                    if (breakStart && !breakEnd) { alert("🚨 エラー：中抜けの終了時間がありません！"); return; }
                    if (!breakStart && breakEnd) { alert("🚨 エラー：中抜けの開始時間がありません！"); return; }
                }

                const safeTimeStr = (hm) => hm ? hm + ':00' : null;
                const finalRemarks = remarks.trim();
                // 【2026-11-08 3.6-3】【本人修正済】は備考の文字に足さず、16列目の印（本人修正あり）で持つ。
                // （備考に印が付くと、夕方の退勤で入れた備考が「手修正済み」扱いで無視されるため）
                let systemAppendedRemarks = finalRemarks;

                let finalRecord = {
                    id: recordId, staffName: defaultStaffName, date: dateStr,
                    clockIn: isPaidLeave ? null : safeTimeStr(clockIn),
                    clockOut: isPaidLeave ? null : safeTimeStr(clockOut),
                    breakStart: isPaidLeave ? null : safeTimeStr(breakStart),
                    breakEnd: isPaidLeave ? null : safeTimeStr(breakEnd),
                    additionalBreakMins: isPaidLeave ? 0 : parseInt(additionalBreak) || 0,
                    meal: isPaidLeave ? false : meal,
                    transport: isPaidLeave ? null : (editTransport === '' ? null : (parseInt(editTransport) || 0)),
                    isPaidLeave: isPaidLeave,
                    remarks: systemAppendedRemarks,
                    clientUpdatedAt: new Date().toISOString()
                };

                // 【2026-11-08】画面を開いたときの値と比べて「変えた項目だけ」を送る（3.5-2）。
                // 開いた後に別の端末で入った打刻や交通費を、触っていない項目で消さないため。
                const initialValues = {
                    clockIn: initialRecord?.clockIn ? safeTimeStr(formatTimeHM(initialRecord.clockIn)) : null,
                    clockOut: initialRecord?.clockOut ? safeTimeStr(formatTimeHM(initialRecord.clockOut)) : null,
                    breakStart: initialRecord?.breakStart ? safeTimeStr(formatTimeHM(initialRecord.breakStart)) : null,
                    breakEnd: initialRecord?.breakEnd ? safeTimeStr(formatTimeHM(initialRecord.breakEnd)) : null,
                    additionalBreakMins: parseInt(initialRecord?.additionalBreakMins || 0) || 0,
                    meal: !!initialRecord?.meal,
                    transport: initialRecord?.transport != null && initialRecord?.transport !== '' ? (parseInt(initialRecord.transport) || 0) : null,
                    isPaidLeave: !!initialRecord?.isPaidLeave,
                    remarks: initialRecord?.remarks || ''
                };
                const changedFields = {};
                if (isPaidLeave && !initialValues.isPaidLeave) {
                    // 有給の設定（3.8-4）: 「有給＝あり」（と備考）だけを送る。行全体に対する操作で、
                    // サーバーが出勤・中抜け・退勤・休憩分数・交通費・賄いを空にし「有給による空欄」の印を付ける
                    changedFields.isPaidLeave = true;
                    if (finalRecord.remarks !== initialValues.remarks) changedFields.remarks = finalRecord.remarks;
                } else if (isPaidLeave) {
                    // 有給のまま備考だけ直す
                    if (finalRecord.remarks !== initialValues.remarks) changedFields.remarks = finalRecord.remarks;
                } else {
                    // 通常の修正・有給の取消（「有給＝なし」が送られると、サーバーは「有給による空欄」の印をすべて外す）
                    Object.keys(initialValues).forEach(k => {
                        if (finalRecord[k] !== initialValues[k]) changedFields[k] = finalRecord[k];
                    });
                }
                onSave(finalRecord, changedFields, !isAdmin && !isPaidLeave);
            };

            const handleDelete = () => {
                if (window.confirm(`本当に ${dateStr} のすべての打刻データ（有給申請含む）を取り消してクリアしますか？\n（この操作は元に戻せません）`)) {
                    onSave(null);
                }
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center modal-overlay p-4 animate-fade-in">
                    <div className="bg-white rounded-3xl w-full max-w-md shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                        <div className={`p-4 text-white flex justify-between items-center ${isPaidLeave ? 'bg-sky-500' : 'bg-primary'}`}>
                            <h3 className="font-bold text-lg flex items-center gap-2">
                                {isPaidLeave ? '🏖 有給申請' : '✏️ 打刻データの修正'}
                            </h3>
                            <button onClick={onClose} className="hover:bg-black/20 p-1 rounded-full transition-colors"><CloseIcon /></button>
                        </div>
                        
                        <div className="p-6 overflow-y-auto flex-1">
                            <div className="text-center font-bold text-xl mb-4 border-b-2 border-primary/10 pb-2">
                                {dateStr} ({dayOfWeek})
                            </div>
                            
                            <label className={`block border-2 rounded-xl p-3 mb-6 cursor-pointer transition-colors ${isPaidLeave ? 'border-sky-500 bg-sky-50' : 'border-gray-200 hover:bg-gray-50'}`}>
                                <div className="flex items-center justify-between">
                                    <span className={`font-bold text-lg ${isPaidLeave ? 'text-sky-600' : 'text-gray-500'}`}>🏖 この日を有給申請にする</span>
                                    <input type="checkbox" checked={isPaidLeave} onChange={(e) => setIsPaidLeave(e.target.checked)} className="w-6 h-6 border-2 accent-sky-500" />
                                </div>
                                {isPaidLeave && <p className="text-xs text-sky-600 mt-2">※出力時に「有給申請」として自動記録されます。</p>}

                            {!isPaidLeave && (
                                <div className="space-y-4 animate-fade-in">
                                    <div className="grid grid-cols-2 gap-4">

                                            <input type="time" value={clockIn} onChange={(e) => setClockIn(e.target.value)} className="w-full border-2 border-primary/20 rounded-xl p-2 font-bold text-lg focus:border-secondary focus:outline-none" />
                                        </div>

                                            <input type="time" value={clockOut} onChange={(e) => setClockOut(e.target.value)} className="w-full border-2 border-primary/20 rounded-xl p-2 font-bold text-lg focus:border-secondary focus:outline-none" />
                                        </div>

                                    <div className="flex gap-4 items-end">
                                        <div className="flex-1">

                                                {(breakStart && breakEnd) ? '中抜けとは別の休憩（分）' : 'この日の休憩時間（分）'}
                                            </label>

                                            {(breakStart && breakEnd) && (
                                                <p className="text-[10px] text-primary/50 mt-1">※中抜け時間は含まず、その他に取った休憩分数</p>

                                        </div>

                                                placeholder="なしは空欄"
                                                className="w-full border-2 border-primary/20 p-2 rounded-xl text-right focus:border-secondary" />

                                            <span className="font-bold text-primary">🥗 賄い</span>

                            <div className="mt-4">

                                <textarea value={remarks} onChange={(e) => setRemarks(e.target.value)} rows="3" placeholder="コメントや申請理由など..." className="w-full border-2 border-primary/20 rounded-xl p-2 text-sm focus:border-secondary focus:outline-none resize-none"></textarea>
                                {!isAdmin && !isPaidLeave && (
                                    <div className="mt-2 p-2 bg-amber-50 rounded text-xs text-amber-700 font-bold border border-amber-200">
                                        ⚠️ 保存した場合、この日に「本人修正済」と記録が残ります。
                                    </div>

                            </div>
                        </div>

                        <div className="p-4 border-t-2 border-primary/10 bg-gray-50 flex justify-between gap-3">
                            <button onClick={handleDelete} className="px-4 py-3 text-sm font-bold text-danger hover:bg-danger/10 rounded-xl transition-colors">

                        </div>
                    </div>
                </div>
            );
        };

        // --- カレンダー・履歴マネージャー ---
        const MonthlyTimeEditor = ({ staffName, isAdmin, timeRecords, submitEdit, deleteFromGAS, onBack, confirmations, onConfirmMonth, loadMonth }) => {
            const [selectedMonth, setSelectedMonth] = useState(() => {
                const now = new Date(); return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            });
            const [editModalData, setEditModalData] = useState(null);

            const [yearStr, monthStr] = selectedMonth.split('-');
            const year = parseInt(yearStr);
            const month = parseInt(monthStr);
            const daysInMonth = new Date(year, month, 0).getDate();

            // 古い月（直近2か月より前）を開いたときは、その月だけクラウドから取る（3.2-1）
            useEffect(() => {
                if (!loadMonth) return;
                const now = new Date();
                const recent = [0, 1].map(i => { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; });
                if (!recent.includes(selectedMonth)) loadMonth(selectedMonth.replace('-', ''));
            }, [selectedMonth]);

            // 【2026-11-08】修正は「変えた項目だけ」を edit 操作で送る。完全取消は delete 操作。
            const handleSaveRecord = (newRecord, changedFields, selfEdit) => {

                if (newRecord === null) {

                } else if (submitEdit) {
                    submitEdit(staffName, editModalData.dateStr, changedFields || {}, !!selfEdit);
                }
                setEditModalData(null);
            };

            const renderTableRows = () => {
                const rows = [];
                for (let d = 1; d <= daysInMonth; d++) {
                    const dateObj = new Date(year, month - 1, d);
                    const dayOfWeek = ['日', '月', '火', '水', '木', '金', '土'][dateObj.getDay()];
                    const rowBgClass = dateObj.getDay() === 0 ? 'bg-red-50' : dateObj.getDay() === 6 ? 'bg-blue-50' : 'bg-white hover:bg-surface transition-colors cursor-pointer';

                    const dateStrLong = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    const recordId = `${staffName}_${dateStrLong}`;
                    const record = timeRecords.find(r => r.id === recordId);

                    rows.push(
                        <tr key={d} className={`border-b border-primary/10 ${rowBgClass}`} onClick={() => setEditModalData({ recordId, dateStr: dateStrLong, dayOfWeek, record, isPaidLeaveMode: false })}>

                        <div className="overflow-x-auto rounded-xl border-2 border-primary/10 shadow-inner max-h-[60vh] overflow-y-auto w-full">

                        {(() => {

この内容がそのまま給与計算に使われます。`)) {

                    </div>

                    {editModalData && (
